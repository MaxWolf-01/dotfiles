<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title$</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" data-external="1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap" data-external="1">
$for(css)$
  <link rel="stylesheet" href="$css$">
$endfor$
  <style>
    main { max-width: 52rem; margin: 0 auto; padding: 3.5rem 1.5rem 5rem; }
    main > header { margin-bottom: 2.5rem; }
    main > header .v-title { margin: 0; }
    main > header .v-meta { margin: 0.6rem 0 0; }
  </style>
  <script>
    const theme = new URLSearchParams(location.search).get('theme');
    if (theme === 'day' || theme === 'night') document.documentElement.dataset.theme = theme;
  </script>
</head>
<body>
  <main>
    <header>
      <h1 class="v-title">$title$</h1>
      <p class="v-meta">$level$ · $date$</p>
    </header>
    <article class="prose">
$body$
    </article>
  </main>
</body>
</html>
