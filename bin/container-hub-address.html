<!doctype html>
<!-- hub.mwolf.dev: bin/container-hub-address builds it, filling in the hubs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>hub</title>
<style>
  :root {
    color-scheme: light dark;
    --ground: light-dark(#f4e4cd, #14110e);
    --muted: light-dark(#5e5650, #b0a89e);
    --body: light-dark(#37261d, #ede3d2);
    --strong: light-dark(#22140b, #faf2dc);
    --accent: light-dark(#426724, #75a252);
    --accent-2: light-dark(#674806, #cdb78a);
  }
  [data-theme="day"] { color-scheme: light; }
  [data-theme="night"] { color-scheme: dark; }
  body {
    margin: 0; padding: 18vh 1.5rem 2rem; background: var(--ground); color: var(--body);
    font: 400 19px/1.62 "Newsreader", Georgia, serif;
  }
  main { max-width: 26rem; margin: 0 auto; }
  h1 { margin: 0 0 0.5rem; font-size: 2rem; font-weight: 600; color: var(--strong); letter-spacing: -0.02em; }
  #status { margin: 0 0 1.5rem; color: var(--muted); min-height: 3.2em; }
  #status.refused { color: var(--accent-2); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 0.35rem 0; }
  a { color: var(--accent); text-underline-offset: 3px; }
  .meta { font: 400 0.8rem/1.4 "IBM Plex Mono", ui-monospace, monospace; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>hub</h1>
  <p id="status">Looking for a hub…</p>
  <ul id="hubs"></ul>
</main>
<script type="application/json" id="hub-list">__HUBS__</script>
<script>
  // [{name, url}], in the order the page tries them.
  const HUBS = JSON.parse(document.getElementById("hub-list").textContent);
  // A hub on the tailnet answers within a second; a host that is down never
  // refuses, its packets just go nowhere, so only a deadline ends the wait.
  const DEADLINE_MS = 4000;

  const theme = new URLSearchParams(location.search).get("theme");
  if (theme === "day" || theme === "night") document.documentElement.dataset.theme = theme;

  const status = document.getElementById("status");
  const list = document.getElementById("hubs");
  const rows = HUBS.map((hub) => {
    const li = document.createElement("li");
    const a = Object.assign(document.createElement("a"), { href: hub.url, textContent: hub.name });
    const note = Object.assign(document.createElement("span"), { className: "meta" });
    li.append(a, " ", note);
    list.append(li);
    return note;
  });

  // Chrome asks before a public page reaches a tailnet address (Local Network
  // Access): undefined where the browser has no such permission.
  async function permission() {
    for (const name of ["local-network", "local-network-access"]) {
      try {
        return await navigator.permissions.query({ name });
      } catch {}
    }
  }

  // The hub lets this page read its /.health, so a host whose tailscale serve
  // answers while the hub behind it is down (a 502) reads as down.
  async function probe(hub) {
    const abort = new AbortController();
    setTimeout(() => abort.abort(), DEADLINE_MS);
    try {
      return (await fetch(new URL(".health", hub.url), { cache: "no-store", signal: abort.signal })).ok;
    } catch {
      return false;
    }
  }

  async function main() {
    const perm = await permission();
    if (perm?.state === "denied") return refused();
    for (const note of rows) note.textContent = "";
    status.textContent = "Looking for a hub that answers…";
    const probes = HUBS.map(probe);
    for (const [i, hub] of HUBS.entries()) {
      if (await probes[i]) {
        status.textContent = `Opening ${hub.name}…`;
        return location.replace(hub.url);
      }
      rows[i].textContent = "does not answer";
    }
    if (perm?.state === "denied") return refused();
    // Chrome prompts only once a connection is made, so a hub that is down
    // never prompts, and neither does a name that resolves off the tailnet
    // alone. Unanswered, the prompt may still be up: its answer probes again.
    if (perm?.state === "prompt") {
      perm.addEventListener("change", main, { once: true });
      status.textContent =
        "No hub answered. Off the tailnet, none can; on it, allow this page to look for them when asked.";
      return;
    }
    status.textContent = "No hub answered. Off the tailnet, none can.";
  }

  function refused() {
    for (const note of rows) note.textContent = "";
    status.className = "refused";
    status.textContent =
      "This browser does not let this page look for the hubs. Allow local network access in the site's settings, or pick one.";
  }

  main();
</script>
</body>
</html>
