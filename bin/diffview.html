<!doctype html>
<!-- Template for bin/diffview: tree + side-by-side diff, keyboard-driven,
     line/hunk comments exported as markdown for the authoring agent.
     Press ? for keys. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --bg: #141519; --panel: #1b1d23; --raised: #22252c; --border: #2c303a;
  --ink: #d6dae2; --ink2: #9aa1af; --ink3: #6a7180;
  --accent: #7aa2f7; --accent-dim: #4b689f;
  --comment: #b083d9; --comment-dim: #7a5a9e;
  --comment-bg: #1f1c27; --comment-field: #16141c; --comment-border: #383049;
  --note: #63bfae; --note-dim: #3d7268;
  --note-bg: #1b2023; --note-border: #2f3a3c;
  --border-strong: #3a4050; --toast-bg: #3a1512;
  --add-no: #6f9a72; --del-no: #a8756f;
  --syn-comment: #7c8494; --syn-keyword: #c792c0; --syn-string: #a8c187; --syn-number: #d0a06b;
  --syn-title: #82aaff; --syn-attr: #9fbcd4; --syn-builtin: #86c0b6; --syn-meta: #d9a648;
  --add: #57ab5a; --add-ink: #85d18d; --add-bg: rgba(87,171,90,.13); --add-mark: rgba(87,171,90,.32);
  --del: #e5534b; --del-ink: #f09a90; --del-bg: rgba(229,83,75,.11); --del-mark: rgba(229,83,75,.30);
  --mod: #8fa7c9; --ren: #b083d9;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --topbar-h: 45px;
}
* { box-sizing: border-box; }
/* overscroll-behavior-x: Chromium translates the page on two-finger horizontal swipe
   (rubber-band + back/forward gesture), incl. when a diffbody's inner scroll chains to the root. */
html { scrollbar-color: #3a3f4b var(--bg); overscroll-behavior-x: none; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink3); }
.mono { font-family: var(--mono); }
.dim { color: var(--ink2); }

.churn { display: inline-flex; height: 8px; width: 52px; border-radius: 2px; overflow: hidden; background: var(--raised); flex: none; align-self: center; }
.churn i { display: block; height: 100%; }
.churn .ca { background: var(--add); }
.churn .cd { background: var(--del); }

.st { font-family: var(--mono); font-size: 11px; font-weight: 700; width: 16px; height: 16px; line-height: 16px;
      text-align: center; border-radius: 3px; flex: none; align-self: center; }
.st.added { color: var(--add-ink); background: var(--add-bg); }
.st.deleted { color: var(--del-ink); background: var(--del-bg); }
.st.modified { color: var(--mod); background: rgba(143,167,201,.12); }
.st.renamed { color: var(--ren); background: rgba(176,131,217,.12); }
.st.untouched { color: var(--ink3); background: var(--raised); }

.adds { color: var(--add-ink); font-family: var(--mono); font-size: 12px; }
.dels { color: var(--del-ink); font-family: var(--mono); font-size: 12px; }

.btn { background: var(--raised); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px;
       cursor: pointer; color: var(--ink2); font-size: 12.5px; white-space: nowrap; }
.btn:hover { color: var(--ink); border-color: var(--border-strong); }
.btn.on { color: var(--accent); border-color: var(--accent-dim); }
.btn kbd { font-family: var(--mono); font-size: 10px; color: var(--ink3); margin-left: 4px; }
.btngrp { display: inline-flex; }
.btngrp .btn:first-child { border-radius: 6px 0 0 6px; }
.btngrp .btn + .btn { border-radius: 0 6px 6px 0; border-left: 0; }
input[type=search], textarea { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; color: var(--ink); }
input[type=search]::placeholder { color: var(--ink3); }

/* ---- diff tables ---- */
.diffbody { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; overflow-x: auto; border-radius: 0 0 8px 8px; }
table.diff { border-collapse: collapse; width: 100%; }
table.diff td { padding: 0 8px; white-space: pre; vertical-align: top; }
body.wrap table.diff td.code { white-space: pre-wrap; word-break: break-word; }
td.no { width: 1%; min-width: 46px; text-align: right; color: var(--ink3); user-select: none; font-size: 11px; padding-top: 2px; position: relative; }
td.no[data-no] { cursor: pointer; }
td.no[data-no]::before { content: "+"; position: absolute; left: 3px; top: 1px; font-weight: 700; color: var(--comment); opacity: 0; }
table.diff tr:hover td.no[data-no]::before { opacity: .95; }
td.no[data-no]:hover { color: var(--comment); background: rgba(176,131,217,.16) !important; }
td.no.csel { background: rgba(176,131,217,.25) !important; color: var(--comment); }
td.no.lcur { outline: 2px solid var(--comment); outline-offset: -2px; }
input[type=checkbox] { accent-color: var(--accent); }
td.code { width: 49%; }
tr.add td.code, tr.add td.no { background: var(--add-bg); }
tr.del td.code, tr.del td.no { background: var(--del-bg); }
tr.add td.no { color: var(--add-no); } tr.del td.no { color: var(--del-no); }
td.code mark { background: transparent; color: inherit; border-radius: 2px; }
tr.add mark { background: var(--add-mark); } tr.del mark { background: var(--del-mark); }
tr.hunkhdr td { background: var(--raised); color: var(--ink3); font-size: 11px; padding: 3px 12px; }
tr.hunkhdr.joined td { padding: 0; height: 2px; font-size: 0; line-height: 0; background: var(--border); }
tr.gap td { color: var(--ink3); font-size: 11px; text-align: center; background: var(--panel); padding: 2px; user-select: none; }
tr.gap button { background: none; border: 0; color: var(--ink2); font-size: 11px; padding: 0 8px; cursor: pointer; }
tr.gap button:hover { color: var(--accent); }
tr.gap button kbd { font-family: var(--mono); font-size: 9.5px; color: var(--ink3); margin-left: 3px; }
tbody.hunk.focus, .fbody.focus { outline: 2px solid var(--accent-dim); outline-offset: -2px; animation: landed .45s ease-out; }
/* the outline flares when it arrives on a hunk, and stays quiet while j only pages inside one */
@keyframes landed { from { outline-color: var(--accent); box-shadow: 0 0 0 4px rgba(122,162,247,.35); } }
.fhead.focus-file { outline: 2px solid var(--accent-dim); outline-offset: -2px; }
#toast { position: fixed; bottom: 14px; left: 14px; z-index: 200; background: var(--toast-bg); border: 1px solid var(--del);
  color: var(--del-ink); border-radius: 8px; padding: 8px 14px; font-size: 12.5px; max-width: 480px; display: none; }
.chip { background: none; border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px; cursor: pointer;
  color: var(--ink3); font-size: 11.5px; }
.chip.on { color: var(--accent); border-color: var(--accent-dim); }
.chip kbd { font-family: var(--mono); font-size: 9.5px; color: var(--ink3); margin-left: 4px; }

/* hljs — quiet palette so diff colors stay the loudest thing */
.hljs-comment, .hljs-quote { color: var(--syn-comment); font-style: italic; }
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-type { color: var(--syn-keyword); }
.hljs-string, .hljs-regexp { color: var(--syn-string); }
.hljs-number, .hljs-symbol { color: var(--syn-number); }
.hljs-title, .hljs-name, .hljs-function .hljs-title { color: var(--syn-title); }
.hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable { color: var(--syn-attr); }
.hljs-built_in, .hljs-builtin-name { color: var(--syn-builtin); }
.hljs-meta, .hljs-section { color: var(--syn-meta); }
.hljs-subst { color: inherit; }

/* ---- comments ---- */
tr.crow > td, tr.arow > td { padding: 0; white-space: normal; }
/* a reply sits one indent step in from what it answers; --depth is set per box when placed */
.cbox, .abox { --indent: 48px; margin: 6px 8px 10px; margin-left: calc(var(--indent) + var(--depth, 0) * 24px); max-width: 720px;
               border-radius: 8px; padding: 8px 12px; font-family: var(--sans); }
.cbox { background: var(--comment-bg); border: 1px solid var(--comment-border); border-left: 3px solid var(--comment); }
.cbox .cref { font-family: var(--mono); font-size: 11px; color: var(--comment); opacity: .85; margin-bottom: 5px; }
.cbox .ctext { font-size: 13px; white-space: pre-wrap; }
.cbox textarea { width: 100%; min-height: 46px; font-size: 13px; background: var(--comment-field); border-color: var(--comment-border); }
.cbox .cbtns { display: flex; gap: 6px; margin-top: 8px; justify-content: flex-end; }
.cbox .btn:hover { border-color: var(--comment-dim); }
.cbox .btn.on { color: var(--comment); border-color: var(--comment-dim); }
/* a resolved comment, or a note marked seen, collapses to one dim line — present enough to say
   "handled, here", cheap enough to scroll past; arriving at one is how you read or revive it */
.cbox.resolved, .abox.seen { opacity: .5; margin-top: 2px; margin-bottom: 2px; padding: 1px 12px; cursor: pointer; }
.cbox.resolved { border-left-color: var(--comment-dim); }
.abox.seen { border-left-color: var(--note-dim); }
.cbox.resolved .ctext, .cbox.resolved .cbtns, .abox.seen .atext, .abox.seen .aref .btn { display: none; }
.cbox.resolved .cref, .abox.seen .aref { margin-bottom: 0; }
.cbox.focus-ann, .abox.focus-ann { outline: 2px solid var(--accent); outline-offset: 2px; opacity: 1; }
.cbox.resolved.focus-ann, .abox.seen.focus-ann { padding: 8px 12px; }
.cbox.resolved.focus-ann .ctext, .abox.seen.focus-ann .atext { display: block; }
.cbox.resolved.focus-ann .cbtns { display: flex; }
.abox.seen.focus-ann .aref .btn { display: inline-block; }
.cbox.resolved.focus-ann .cref, .abox.seen.focus-ann .aref { margin-bottom: 5px; }
#copy-btn { color: var(--comment); border-color: var(--comment-dim); }
.readonly { position: relative; margin: 0 1rem .8rem; padding: .5rem 2.2rem .5rem .8rem; font-size: 12.5px; color: var(--ink2);
  background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--comment-dim); border-radius: 6px; }
.savefail { border-left-color: #e06c75; }
.savefail strong { color: #e06c75; }
.readonly .btn { margin: 0 .1rem 0 .5rem; }
.rox { position: absolute; top: .3rem; right: .45rem; padding: 0 .3rem; font-size: 15px; line-height: 1.2;
  background: none; border: 0; color: var(--ink3); cursor: pointer; }
.rox:hover { color: var(--ink); }
.readonly strong { color: var(--comment); font-weight: 600; }
.readonly code { font-family: var(--mono); font-size: 11.5px; color: var(--ink); background: var(--raised);
  border: 1px solid var(--border); border-radius: 4px; padding: 0 .3rem; }
#copy-btn:hover { color: #c9a4e8; border-color: var(--comment); }

/* ---- agent notes (display-only, from --notes) ---- */
.abox { background: var(--note-bg); border: 1px solid var(--note-border); border-left: 3px solid var(--note); }
.abox .aref { display: flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 11px;
              color: var(--note); margin-bottom: 5px; }
.abox .badge { background: var(--note-dim); color: #dff5ef; font-size: 9.5px; font-weight: 700;
               letter-spacing: .1em; text-transform: uppercase; padding: 1px 7px; border-radius: 4px; }
.abox .aref .btn { padding: 1px 8px; font-size: 11px; }
.abox .aref .btn:first-of-type { margin-left: auto; }
.abox .aref .btn:hover { border-color: var(--note-dim); }
.abox .atext { font-size: 13px; }
.abox .atext p { margin: .2em 0; }
.abox .atext code { font-family: var(--mono); font-size: .9em; background: rgba(99,191,174,.12); border-radius: 4px; padding: 0 4px; }
.abox.file, .cbox.file { --indent: 12px; margin-top: 10px; margin-bottom: 10px; margin-right: 12px; }
.fhead .acount { font-size: 11px; color: var(--note); }
body.hide-notes tr.arow, body.hide-notes .abox.file { display: none; }

/* ---- file card ---- */
.fcard { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); margin: 0 0 14px;
         scroll-margin-top: var(--topbar-h); }   /* scrolled to, a card lands under the sticky bar rather than behind it */
.fcard.viewed > .fhead { opacity: .55; }
.fhead { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--raised);
         position: sticky; top: var(--topbar-h); z-index: 3; cursor: pointer; border-bottom: 1px solid var(--border);
         border-radius: 8px 8px 0 0; }
.fhead .path { font-family: var(--mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fhead .path b { font-weight: 600; color: var(--ink); }
.fhead .path span { color: var(--ink2); }
.fhead .spacer { flex: 1; }
.fhead label { display: flex; gap: 5px; align-items: center; font-size: 11.5px; color: var(--ink3); cursor: pointer; }
.fhead .ccount { font-size: 11px; color: var(--comment); }
.fhead .pos { font-family: var(--mono); font-size: 11px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
.fhead .pos b { color: var(--accent); font-weight: 600; }
.fcard.collapsed .diffbody, .fcard.collapsed .imgblock, .fcard.collapsed .binmsg { display: none; }
.binmsg { padding: 10px 14px; color: var(--ink3); font-size: 12.5px; }

/* ---- images ---- */
/* --img-cap: the tallest a fitted image gets; --view-cap: the tallest its window grows zoomed in,
   scrolling past that. In CSS pixels, which the browser's zoom scales */
.imgblock { --img-cap: 600px; --view-cap: 75vh; padding: 10px 14px 12px; }
.imgmeta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-bottom: 8px;
  font-family: var(--mono); font-size: 11.5px; color: var(--ink2); }
.imgmeta .imgzoom { color: var(--ink3); }
.imgmeta .chips { display: flex; gap: 4px; margin-left: auto; font-family: var(--sans); }
.imgscroll:has(> .imgview.stacked) { overflow: auto; }
.imgscroll, .imgframe { scrollbar-width: thin; }
.imgview { position: relative; }
.imgview.zoomed { user-select: none; }
.imgcanvas { position: relative; }
.imgframe img { display: block; max-width: 100%; height: auto; cursor: zoom-in;
  background: repeating-conic-gradient(#30333b 0 25%, #24262d 0 50%) 0 0 / 16px 16px; }
.imgview.zoomed img { cursor: grab; }
.imgblock.panning img { cursor: grabbing; }
/* from twice natural size each image pixel shows as a square block, as it is, not smoothed into its
   neighbours; below that, blocks of uneven width would make text harder to read than smoothing does */
.imgview.magnified img { image-rendering: pixelated; }
/* where the pointer is in the other version; its middle is left open so the pixel under it shows */
.imgghost { position: absolute; left: 0; top: 0; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
  border: 2px solid var(--accent); box-shadow: 0 0 0 1px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.6);
  pointer-events: none; display: none; }
.imgghost.on { display: block; }
.imgmiss { padding: 10px 12px; color: var(--ink3); font-size: 12.5px; border: 1px dashed var(--border-strong); border-radius: 6px; }
.imglabel { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 5px; }
.imgside.old .imglabel { color: var(--del-ink); }
.imgside.new .imglabel { color: var(--add-ink); }
/* 2-up: a column per version, each a window as wide as its drawing up to the column's width,
   outlined in the diff's colours */
.imgview.twoup { display: flex; gap: 16px; align-items: flex-start; }
.imgview.twoup > .imgside { flex: 1 1 0; min-width: 0; }
.imgview.twoup .imgframe { width: fit-content; max-width: 100%; overflow: auto; }
.imgview.twoup > .imgside.old .imgframe:has(> .imgcanvas) { outline: 2px solid var(--del); }
.imgview.twoup > .imgside.new .imgframe:has(> .imgcanvas) { outline: 2px solid var(--add); }
.imgblock.untouched .imgview.twoup .imgframe { outline: 0; }
/* the overlaid views: both versions in one grid cell, the new one on top */
.imgview.stacked { display: grid; grid-template-columns: 100%; }
.imgview.stacked > .imgside { grid-area: 1 / 1; }
.imgview.stacked .imglabel { display: none; }
/* swipe: new left of the divider, old right of it, so the slider's new end shows all of the new version */
.imgview.swipe > .imgside.new { clip-path: inset(0 calc(100% - var(--p) * 1%) 0 0); }
.imgview.swipe > .imgside.old { clip-path: inset(0 0 0 calc(var(--p) * 1%)); }
.imgview.swipe::after { content: ""; position: absolute; top: 0; bottom: 0; left: calc(var(--p) * 1%); width: 2px;
  margin-left: -1px; background: var(--accent); pointer-events: none; }
.imgview.onion > .imgside.new { opacity: calc(var(--p) / 100); }
.imgview.onion > .imgside.new img, .imgview.difference img { background: none; }
/* difference: equal pixels cancel to black; isolated, so the blend never reaches past the two images */
.imgview.difference { background: #000; isolation: isolate; }
.imgview.difference > .imgside.new { mix-blend-mode: difference; }
.imgslider { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 11px; color: var(--ink3); }
.imgslider input { flex: 0 1 420px; }

/* ---- layout ---- */
/* the bar wraps onto more rows when the window is narrow; --topbar-h is measured from it, so
   everything that sticks below it (file headers, the tree, the panels) follows */
.top { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; min-height: var(--topbar-h);
  padding: 6px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--border); }
.top h1 { font-size: 14px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 26vw; }
.top .dim { white-space: nowrap; }   /* a narrow window shortens the title, not the counters */
.top #filter { width: 110px; }   /* fits its placeholder */
.layout { display: grid; grid-template-columns: 300px minmax(0,1fr); }
/* z-index: the tree paints after the diff's positioned line numbers, which keeps them in the document's
   GPU layer; a sticky tree painted before them lifts them all into one layer as tall as every rendered card */
.side { position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); overflow-y: auto; z-index: 1;
  padding: 10px 6px 80px; border-right: 1px solid var(--border); font-size: 12.5px; background: var(--bg); }
body.no-side .layout { grid-template-columns: minmax(0,1fr); }
body.no-side .side { display: none; }
/* narrow: the tree is not worth a column; shown, it slides over the diff and closes when a file is picked */
@media (max-width: 1099px) {
  .layout { grid-template-columns: minmax(0,1fr); }
  .side { position: fixed; left: 0; width: min(300px, 85vw); z-index: 20; box-shadow: 10px 0 30px rgba(0,0,0,.45); }
}
@media (max-width: 899px) {
  .main { padding: 10px 8px 60vh; }
  .fhead .pos span { display: none; }   /* the hunk's number stays, its label goes */
}
.side .src { margin: 10px 6px 4px; }
.tree-dir { color: var(--ink2); padding: 2px 6px; cursor: pointer; user-select: none; }
.tree-dir::before { content: "▾ "; font-size: 9px; color: var(--ink3); }
.tree-dir.closed::before { content: "▸ "; }
.tree-kids { margin-left: 12px; border-left: 1px solid var(--border); padding-left: 4px; }
.tree-dir.closed + .tree-kids { display: none; }
.tree-file { display: flex; gap: 6px; align-items: center; padding: 2px 6px; border-radius: 5px; cursor: pointer; font-family: var(--mono); font-size: 11.5px; }
.tree-file:hover { background: var(--raised); }
.tree-file.current, .tree-dir.current { background: var(--raised); box-shadow: inset 2px 0 0 var(--accent); }
.tree-file.current .nm, .tree-dir.current { color: var(--accent); }
.tree-file.viewed { opacity: .45; }
.tree-file .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-file .churn { width: 34px; height: 6px; }
.main { padding: 14px 18px 60vh; min-width: 0; }
.summary { position: relative; max-width: 78ch; font-size: 14px; line-height: 1.6; color: var(--ink); background: var(--panel);
  border: 1px solid var(--border); border-radius: 8px; padding: 4px 16px; margin: 0 auto 16px; }
.summary code { font-family: var(--mono); font-size: .9em; background: var(--raised); border-radius: 4px; padding: 1px 5px; }
.summary.pending { color: var(--ink2); font-style: italic; padding: 10px 16px; }
.summary.pending:has(.rox) { padding-right: 2.2rem; }
.summary .rewrite { position: absolute; top: 5px; right: 6px; background: none; border: 0; padding: 2px 6px;
  color: var(--ink3); font-size: 15px; cursor: pointer; border-radius: 4px; }
.summary .rewrite:hover { background: var(--raised); color: var(--ink); }
.summary .rewrite.stale { color: var(--accent); }
.summary .lnk { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; }
.src-hdr { margin: 26px 0 10px; display: flex; gap: 10px; align-items: baseline; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.src-hdr h2 { font-size: 16px; margin: 0; }
.hidden { display: none !important; }

/* ---- history panel ---- */
/* beside the diff on a wide window, so the diff stays in view while commits are selected; over the diff on a narrow one */
#commits { --hist-w: min(480px, 40vw); position: fixed; top: var(--topbar-h); right: 0; bottom: 0; width: var(--hist-w); background: var(--bg);
  border-left: 1px solid var(--border); z-index: 20; overflow-y: auto; padding: 10px 10px 60px; display: none; }
#commits.open { display: block; }
@media (min-width: 1100px) { body.history-open .layout { margin-right: min(480px, 40vw); } }
@media (max-width: 1099px) { #commits { --hist-w: min(480px, 92vw); background: var(--panel); box-shadow: -10px 0 30px rgba(0,0,0,.45); } }
.hist-top { display: flex; justify-content: space-between; align-items: center; margin: 0 4px 2px; }
.hist-hint { font-size: 11.5px; color: var(--ink3); margin: 0 4px 10px; }
.hc { padding: 6px 8px 7px; margin-bottom: 3px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; user-select: none; }
.hc:hover { background: var(--panel); border-color: var(--border); }
.hc.sel { background: rgba(122,162,247,.09); border-color: var(--accent-dim); box-shadow: inset 3px 0 0 var(--accent); }
.hc-head { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; }
.hc-head .sha { font-family: var(--mono); font-size: 11px; color: var(--ink3); flex: none; }
.hc.sel .sha { color: var(--accent); }
.hc.wt .sha { color: var(--syn-meta); }
.hc-head .subj { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hc-head .when { font-family: var(--mono); font-size: 10.5px; color: var(--ink3); flex: none; }
/* the disclosure triangle in front of a commit whose message has more than its subject; an empty one keeps the rest aligned */
.fold { flex: none; width: 12px; padding: 0; background: none; border: 0; color: var(--ink3); font-size: 10px; }
button.fold { cursor: pointer; }
button.fold::before, .has-body .fold::before { content: "▸"; }
.hc.open > .hc-head > .fold::before, .item.open > .has-body .fold::before { content: "▾"; }
button.fold:hover, .has-body:hover .fold { color: var(--accent); }
.hc-body { display: none; margin: 4px 0 2px 20px; color: var(--ink2); font-size: 12px; white-space: pre-wrap; }
.hc.open .hc-body { display: block; }
.hist-day { margin: 14px 8px 4px; font-size: 11px; color: var(--ink3); letter-spacing: .04em; border-bottom: 1px solid var(--border); padding-bottom: 3px; }
.hc-files { margin: 3px 0 0 16px; }
/* each count column is as wide as its widest count in the panel, so every row's counts and bars line up */
.hc-file { display: grid; grid-template-columns: 16px minmax(0,1fr) var(--adds-w) var(--dels-w) 52px; gap: 7px; align-items: center; padding: 0 4px 0 2px;
  border-radius: 4px; font-family: var(--mono); font-size: 11.5px; line-height: 1.6; }
.hc-file:hover { background: var(--raised); }
.hc-file .st { width: 14px; height: 14px; line-height: 14px; font-size: 10px; }
.hc-p { display: flex; min-width: 0; white-space: nowrap; }
/* a long path is cut in its directories first, and in the file name only once they are gone */
.hc-p .d { overflow: hidden; text-overflow: ellipsis; color: var(--ink3); min-width: 0; }
.hc-p b { font-weight: 500; color: var(--ink); flex: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.hc-file:hover .hc-p b { color: var(--accent); }
.hc-file .adds, .hc-file .dels { font-size: 11px; text-align: right; }
.hc-file .zero { color: var(--ink3); opacity: .6; }
.hc-file .churn { height: 6px; justify-self: start; }
/* ---- the lens: the page showing some commits, not the full diff ---- */
.lensbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin: 0 0 12px; padding: 8px 12px;
  border: 1px solid var(--accent-dim); border-left: 3px solid var(--accent); border-radius: 8px; background: rgba(122,162,247,.07); font-size: 13px; }
.lensbar b { color: var(--accent); font-weight: 600; }
.strays { margin: 0 0 14px; padding: 8px 12px 1px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
.strays .cbox { margin-left: 0; }
.src-msg { margin: -4px 0 14px; max-width: 90ch; font-size: 13px; }
.src-msg .subj { font-weight: 600; }
.src-msg .dim.mono { font-size: 11px; margin: 1px 0 4px; }
.src-msg .body { color: var(--ink2); white-space: pre-wrap; font-size: 12.5px; }
.src-msg .line { display: flex; gap: 4px; align-items: baseline; white-space: nowrap; }
.src-msg .line .t { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.src-msg .line.has-body { cursor: pointer; }
.src-msg .line.has-body:hover { color: var(--accent); }
.src-msg .item > .body { display: none; margin: 2px 0 8px 16px; }
.src-msg .item.open > .body { display: block; }

/* ---- overlays: the help sheet and the Ctrl+K jump prompt ---- */
#help, #jump { position: fixed; inset: 0; z-index: 100; background: rgba(10,11,13,.7); display: none; justify-content: center; }
#help { align-items: center; }
#jump { align-items: flex-start; z-index: 110; background: rgba(10,11,13,.55); }
#help.open, #jump.open { display: flex; }
#help .card, #jump .card { background: var(--panel); border: 1px solid var(--border-strong); border-radius: 10px;
  padding: 20px 26px; box-shadow: 0 10px 40px rgba(0,0,0,.6); max-width: 94vw; max-height: 92vh; overflow: auto; }
#jump .card { margin-top: 18vh; padding: 14px 18px; width: min(420px, 86vw); }
#jump input { width: 100%; margin-top: 8px; font-family: var(--mono); }
#help table { border-collapse: collapse; font-size: 13px; }
#help td { padding: 3px 14px 3px 0; }
#help kbd { font-family: var(--mono); background: var(--raised); border: 1px solid var(--border); border-radius: 4px; padding: 1px 7px; font-size: 12px; }
</style>

<body>
<div id="app"></div>
<div id="commits"></div>
<div id="jump"></div>
<div id="help"></div>
<div id="toast"></div>
<script>__HLJS__</script>
<script>
"use strict";
const DATA = "__DATA__";

/* ================= state ================= */
const changed = f => f.status !== "untouched";   // an untouched file is on the page because a note put it there
/* Everything that lists files follows one order, the tree's read top to bottom: the cards, j/J/Ctrl+d,
   the copies. Changed files, then the untouched ones; within a directory its own files, then its
   subdirectories; names compare case-insensitively, digits as numbers. */
const NAME_ORDER = new Intl.Collator("en", { numeric: true, sensitivity: "base" });
function treeOrder(a, b) {
  if (changed(a) !== changed(b)) return changed(a) ? -1 : 1;
  const pa = a.path.split("/"), pb = b.path.split("/");
  for (let i = 0; i < Math.min(pa.length, pb.length); i++) {
    const fileA = i === pa.length - 1, fileB = i === pb.length - 1;
    if (fileA !== fileB) return fileA ? -1 : 1;
    // names equal but for case are still two entries in the tree; code units keep them apart
    const c = NAME_ORDER.compare(pa[i], pb[i]) || (pa[i] < pb[i] ? -1 : pa[i] > pb[i] ? 1 : 0);
    if (c) return c;
  }
  return 0;
}
/* A view is what the page shows: the full diff, or a lens on some of the history's commits. Each
   view keys its files apart, so a viewed mark or opened context in one view never applies to another. */
function viewOf(sources, keyOf) {
  sources.forEach((s, si) => s.files.sort(treeOrder).forEach(f => { f.key = keyOf(s, si, f.path); }));
  const all = sources.flatMap((s, si) => s.files.map(f => ({ s, si, f })));
  // a card without hunks is a stop of its own, at hunk index -1
  const hunks = all.flatMap(x => x.f.hunks.length ? x.f.hunks.map((hk, hi) => ({ x, hk, hi })) : [{ x, hk: null, hi: -1 }]);
  // a hunk's label is fixed here, so a widened hunk still goes by the name git gave it
  for (const { x, hk } of hunks) {
    if (!hk) continue;
    hk.at = changed(x.f) ? `@@ −${hk.os} +${hk.ns}` : `L${hk.ns}`;
    hk.label = hk.at + (hk.header ? "  " + hk.header : "");
  }
  return { sources, all, hunks, churnMax: Math.max(...all.map(x => x.f.adds + x.f.dels), 1), totals: {
    files: all.filter(x => changed(x.f)).length,
    adds: all.reduce((n, x) => n + x.f.adds, 0),
    dels: all.reduce((n, x) => n + x.f.dels, 0),
  } };
}
const RANGE = viewOf(DATA.sources, (s, si, path) => si + ":" + path);
let VIEW = RANGE, ALL = RANGE.all, HUNKS = RANGE.hunks, TOTALS = RANGE.totals;
let LENS = new Set();   // the commits the lens shows, as "si:short"; empty shows the full diff
const COMMITS = DATA.sources.reduce((n, s) => n + (s.commits ? s.commits.length : 0), 0);
const NOTES = new Map();  // fileKey -> agent notes from --notes, each carrying the anchor it resolved to
for (const n of DATA.notes || []) {
  if (n.lensKey) {   // an answer to a comment written with commits selected sits under it, where those commits show
    Object.assign(n, { fileKey: n.lensKey, hi: -1, side: "new" });
    NOTES.set(n.lensKey, [...(NOTES.get(n.lensKey) || []), n]);
    continue;
  }
  const matches = RANGE.all.filter(x => x.f.path === n.path || x.f.path.endsWith("/" + n.path));
  if (!matches.length) continue;
  const side = n.side === "old" ? "old" : "new";
  const hunkOf = x => n.line == null ? -1
    : x.f.hunks.findIndex(hk => hk.lines.some(ln => (side === "new" ? ln[2] : ln[1]) === n.line));
  const x = matches.find(m => hunkOf(m) >= 0) || matches[0];   // same path in two sources: prefer the one holding the line
  n.side = side;
  n.fileKey = x.f.key;
  n.hi = hunkOf(x);
  if (!NOTES.has(x.f.key)) NOTES.set(x.f.key, []);
  NOTES.get(x.f.key).push(n);
}
// A page loaded from file:// cannot write to disk, so a served page is the only one that
// can take comments. The file beside the page is their home; the browser keeps a copy of
// every write too, so a server that dies mid-review never leaves the page holding the only one.
const SERVED = location.protocol.startsWith("http");
const AT_ROOT = SERVED && location.pathname === "/";   // only --watch addresses a page this way; --serve serves it by name
const FROM_WATCH = !!DATA.restart;   // only --watch writes its restart command into the page it renders
const AGENT_RESOLVED = new Set(DATA.agentResolved || []);
const WRITER = `${Date.now().toString(36)}.${Math.random().toString(36).slice(2, 8)}`;  // this page, while it is open
// localStorage is per origin, so per server; the page's path is the review's identity within it
const LOCAL_KEY = "dv-state:" + DATA.key;       // the local copy: this page's review state, kept until it lands
const READING_KEY = "dv-reading:" + DATA.key;   // the reading state: the reader's own marks, shared by this browser's tabs, never the file's
let SINCE = null;      // the file version this page's next write is based on: the one it last loaded, merged or landed
let LANDED = null;     // the landed state: the review state this page last knew the file to hold; S is that plus its unlanded changes
let LAST_SAVED = 0;    // savedAt of the last write sent: the next is later, however fast the clock
let NEWEST = 0;        // savedAt of the newest write of this page's own that landed
let UNSAVED = false;   // the state loaded is the local copy, holding a write that never landed
let INFLIGHT = 0;      // writes sent and not yet answered
let RETRY = null;      // polling a server that stopped answering
let SYNC = null;       // the file being fetched and merged; one at a time
let S;
function initState(stored, reading) {
  S = {
    split: innerWidth >= 1000, wrap: true, filterMode: "path",   // two columns of code need the width; s toggles
    imageView: "2-up",                  // one view for every image on the page; i cycles it
    viewed: new Set(reading.viewed || []),
    comments: stored.comments || [],   // {id, fileKey, hi, side:'old'|'new'|'hunk'|'file', start, end, text, excerpt, re?}; a 'file' comment has hi -1
    focus: -1,                          // index into HUNKS
    ann: null,                          // focused annotation: {kind:'note'|'comment', id}
    verdict: new Map(stored.verdict || []),     // comment id -> your resolve call, only where it differs from the agent's
    seen: new Map(stored.seen || []),           // note id -> its text when you marked it seen; a rewritten note comes back unseen
    undo: null,                         // last deleted comment, restorable with u (session-only)
    folded: new Map(),                  // foldKey -> {si, changed, dir}: directories folded in the tree and on the page (session-only)
    nextId: stored.nextId || 1,
    expand: new Map(reading.expand || []),      // fileKey -> {h: {hi: [above, below]}, all}: context opened around hunks
  };
}
/* the review state a blob holds, as this page's own record of it: copies, so what S does next never moves it */
function reviewOf(blob) {
  return { comments: structuredClone(blob.comments || []), verdict: new Map(blob.verdict || []),
           seen: new Map(blob.seen || []), nextId: blob.nextId || 1 };
}

/* ---- reading state: the reader's own marks, in this browser ----
   Which files are viewed and what context is open are one reader's progress, not the review's: they
   stay out of the file a shared page carries, and this browser's tabs on the page share them. A state
   file may still carry them, written when they were the file's; the first load here with none of its
   own takes them over, and the next save writes the file without them. */
function readingState(stored) {
  const kept = loadReading();
  if (kept) return kept;
  const taken = { viewed: stored.viewed || [], expand: stored.expand || [] };
  if (taken.viewed.length || taken.expand.length) storeReading(taken);
  return taken;
}
function loadReading() {
  try { const r = JSON.parse(localStorage.getItem(READING_KEY)); return r && typeof r === "object" ? r : null; } catch (e) { return null; }
}
function storeReading(r) {
  try { localStorage.setItem(READING_KEY, JSON.stringify({ viewed: [...r.viewed], expand: [...r.expand] })); } catch (e) {}
}
/* read, change, write, so two tabs changing different marks never erase each other's. The viewed marks
   come back whole, another tab's included; the opened context stays this tab's own, since only this
   tab's hunks are open the way it recorded */
function changeReading(change) {
  const kept = loadReading();
  const r = { viewed: new Set(kept ? kept.viewed : S.viewed), expand: new Map(kept ? kept.expand : S.expand) };
  change(r);
  storeReading(r);
  S.viewed = r.viewed;
}
function syncReading() {
  const kept = loadReading();
  if (!kept) return;
  const viewed = new Set(kept.viewed || []);
  if (viewed.size === S.viewed.size && [...viewed].every(k => S.viewed.has(k))) return;
  S.viewed = viewed;
  showViewed();
}

/* ---- the state file, and following it ----
   The state baked into the page is as old as the render; the file beside a served page holds
   everything saved since, so a plain reload reads that -- unless this browser holds a write the
   file never got, which is then what the page loads, merged with whatever the file gained meanwhile,
   and saves at once. The file, not a record the page keeps, says whether a write landed: a reload
   can beat the acknowledgement. */
async function loadState() {
  if (!SERVED) {
    const stored = DATA.saved || {};
    initState(stored, readingState(stored));
    LANDED = reviewOf(stored);
    return;
  }
  const file = await fetchBeside(".state.json");
  const local = localCopy();
  if (local && !(file && file.savedAt === local.savedAt)) {
    UNSAVED = true;
    initState(local, readingState(file || local));
    LANDED = reviewOf(local.landed || {});
    SINCE = local.since ?? null;
    if (file) mergeFile(file);
    return;
  }
  if (local) dropLocal();   // landed after all
  const stored = file || DATA.saved || {};
  initState(stored, readingState(stored));
  LANDED = reviewOf(stored);
  SINCE = file ? file.savedAt ?? null : null;
}
/* a file kept beside this page, parsed; null while nothing is written there, or when no server answers */
async function fetchBeside(suffix) {
  try {
    const res = await fetch(location.pathname + suffix, { cache: "no-store" });
    if (res.ok) return await res.json();
  } catch (e) {}
  return null;
}
function localCopy() {
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY)); } catch (e) { return null; }
}
function dropLocal() {
  try { localStorage.removeItem(LOCAL_KEY); } catch (e) {}
}
let copyRefused = false;
function persist() {
  if (!SERVED) return;
  // savedAt names this write to whoever loads it next; writer and since let the server tell a page
  // that saw the file's current version from one that did not
  LAST_SAVED = Math.max(Date.now(), LAST_SAVED + 1);
  // every field a copy: the write is what S holds now, and landed() records exactly that, not what S holds at the acknowledgement
  const blob = { savedAt: LAST_SAVED, writer: WRITER, since: SINCE, comments: structuredClone(S.comments), nextId: S.nextId,
                 verdict: [...S.verdict], seen: [...S.seen] };
  // before the send, so the file is never the only copy; with the landed state beside it, so a reload
  // merges what never landed into whatever the file holds by then
  const landedState = { ...LANDED, verdict: [...LANDED.verdict], seen: [...LANDED.seen] };
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ ...blob, landed: landedState })); }
  catch (e) { if (!copyRefused) toast("the browser refused to keep a copy of this review (storage full?); the file is the only one"); copyRefused = true; }
  INFLIGHT++;
  // keepalive: a reload right after typing must not cancel the save the reload then reads
  fetch(location.pathname + ".state.json", { method: "POST", body: JSON.stringify(blob), keepalive: true })
    .then(res => {
      if (res.status === 409) return refused();
      if (!res.ok) throw new Error(res.status);
      landed(blob);
      saveWorks();
    })
    .catch(() => saveBroke())   // a dead server must not look like a saved comment
    .finally(() => { INFLIGHT--; });
}
/* the file holds this write now: it is the landed state and the base of the next write, and the copy
   of it here has done its job -- unless a later write has already taken the slot */
function landed(blob) {
  if (blob.savedAt < NEWEST) return;   // acknowledged after a later write of this page's own: that one is the landed state
  NEWEST = SINCE = blob.savedAt;
  LANDED = reviewOf(blob);
  const held = localCopy();
  if (held && held.savedAt === blob.savedAt) dropLocal();
}
function saveWorks() {
  if (!RETRY) return;
  clearInterval(RETRY);
  RETRY = null;
  document.querySelector(".savefail")?.remove();   // saving again is the whole message; a stale warning is a lie
}
function saveBroke() {
  if (!RETRY) RETRY = setInterval(persist, 3000);  // the server coming back lands everything typed while it was gone
  if (document.querySelector(".savefail")) return;
  const cmd = (AT_ROOT && DATA.restart) || `diffview --serve ${DATA.key.replace(/\/[^/]*$/, "")}`;
  const copy = h("button", { cls: "btn", title: "copy the command" }, "copy");
  copy.addEventListener("click", () => copyText(cmd, () => { copy.textContent = "copied ✓"; setTimeout(() => copy.textContent = "copy", 1200); }));
  const bar = h("div", "readonly savefail",
    h("strong", null, "not saving"),
    " — the server stopped answering. What you type stays in this browser and is saved once the server is back; reload only after that. Start it again with ",
    h("code", null, cmd), copy,
    ", and this page saves everything back on its own. Or press ", h("code", null, "C"), " to copy your comments out.",
    h("button", { cls: "rox", title: "dismiss", onclick: () => bar.remove() }, "×"));
  document.querySelector(".top").after(bar);
}
/* the file moved between this page's last sync and this write: take the file, keep what this page
   changed since, send again. Nobody is asked; the merge loses nothing it does not say. A fetch the
   poll started just before may be the one taken: then its file predates the move, and the resend is
   refused once more, which comes back here with a fresh fetch */
function refused() {
  return takeFile().then(persist);
}
/* the file as it is now, merged in when it is a version this page has not seen. One at a time, since
   the poll, a refused save and a focus can all ask */
function takeFile() {
  if (!SYNC) SYNC = fetchBeside(".state.json")
    .then(file => { if (file && file.savedAt !== SINCE) mergeFile(file); })
    .finally(() => { SYNC = null; });
  return SYNC;
}
/* the page follows its file: what another page saved is merged in, and the request is the heartbeat a
   --serve server counts an open tab by. Nothing is merged over a write of this page's own that is still
   in the air, or waiting on a server that stopped answering: the answer to that write decides, and the
   poll returns after; so a file the poll finds newer is always another page's */
function follow() {
  if (!S) return;   // the state file is still being read
  syncReading();
  if (INFLIGHT || RETRY || SYNC) return;
  takeFile();
}

/* ---- the merge ----
   Three ways: the landed state against this page's state against the file. A comment the landed state
   lacks is this page's addition, a restore of a deleted one included; it keeps its id unless the file
   holds another comment under it, and then takes the next free one. An edit lands on the file's copy,
   or is dropped when the file no longer has that comment. A deletion deletes. A verdict or a seen mark
   this page changed applies. Everything else is the file's. The page's own comment objects stay the
   objects they were, so an editor open on one, or the undo slot, still points at the right comment.
   Only the cards whose annotations changed are redrawn, and what the reader is looking at stays put. */
const sameComment = (a, b) => a.fileKey === b.fileKey && a.hi === b.hi && a.side === b.side && a.start === b.start
  && a.end === b.end && a.text === b.text && (a.re ?? null) === (b.re ?? null);
function mergeFile(file) {
  const theirs = reviewOf(file), landed = LANDED;
  const landedById = new Map(landed.comments.map(c => [c.id, c]));
  const mineById = new Map(S.comments.map(c => [c.id, c]));
  const theirsById = new Map(theirs.comments.map(c => [c.id, c]));
  const before = annotationSigs();
  const out = new Map(), renamed = new Map(), dropped = [];
  let next = Math.max(theirs.nextId, S.nextId);
  for (const t of theirs.comments) {
    const mine = mineById.get(t.id), was = landedById.get(t.id);
    if (was) {
      if (!mine) continue;                                                     // deleted here since the landed state
      if (sameComment(mine, was)) out.set(t.id, Object.assign(mine, t));       // untouched here: the file's version
      else out.set(t.id, Object.assign(mine, t, { text: mine.text, start: mine.start, end: mine.end, excerpt: mine.excerpt }));   // edited here
    } else if (mine && sameComment(mine, t)) out.set(t.id, Object.assign(mine, t));   // added here, and landed meanwhile after all
    else out.set(t.id, t);                                                     // the file's own; one added here under this id moves below
  }
  for (const c of S.comments) {
    const was = landedById.get(c.id);
    if (was) { if (!sameComment(c, was) && !theirsById.has(c.id)) dropped.push(c.id); continue; }   // edited here, deleted there
    if (out.get(c.id) === c) continue;
    if (out.has(c.id)) {
      while (out.has(next)) next++;   // a file edited by hand may hold an id past its own counter
      renamed.set(c.id, next);
      c.id = next++;
    }
    out.set(c.id, c);
    next = Math.max(next, c.id + 1);
  }
  const marks = (mine, was, held, remap) => {   // a mark this page set or cleared since the landed state wins; the rest is the file's
    const merged = new Map(held);
    for (const id of new Set([...mine.keys(), ...was.keys()])) {
      if (mine.get(id) === was.get(id)) continue;
      const to = remap && renamed.has(id) ? renamed.get(id) : id;
      mine.has(id) ? merged.set(to, mine.get(id)) : merged.delete(to);
    }
    return merged;
  };
  S.comments = [...out.values()];
  S.verdict = marks(S.verdict, landed.verdict, theirs.verdict, true);
  S.seen = marks(S.seen, landed.seen, theirs.seen, false);
  S.nextId = Math.max(next, ...S.comments.map(c => c.id + 1));

    h("table", null, KEYS.map(([k, d]) => h("tr", null, h("td", null, h("kbd", null, k)), h("td", "dim", d))))));
  document.getElementById("help").addEventListener("click", e => {
    if (e.target.id === "help") e.target.classList.remove("open");
  });
}

/* ================= layout ================= */
function render() {
  const app = document.getElementById("app");
  const filter = h("input", { type: "search", placeholder: "filter…  ( / )", id: "filter" });
  filter.addEventListener("input", applyFilter);
  const modeChips = h("span", { style: "display:flex;gap:4px" }, Object.keys(FILTER_MODES).map(m => {
    const chip = h("button", { cls: "chip" + (S.filterMode === m ? " on" : ""), title: m[0] }, m);
    chip.addEventListener("click", () => {
      S.filterMode = m;
      modeChips.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.textContent === m));
      applyFilter(); filter.focus();
    });
    return chip;
  }));
  const toggle = (id, label, key, setup) => {
    const b = h("button", { cls: "btn" + (S[key] ? " on" : ""), id }, label, h("kbd", null, id === "split-btn" ? "s" : "w"));
    b.addEventListener("click", () => { S[key] = !S[key]; b.classList.toggle("on", S[key]); setup(); });
    return b;
  };
  const copyButton = (id, key, title, label, text) => {
    const btn = h("button", { cls: "btn", id, title });
    const fill = () => btn.replaceChildren(h("span", "lbl", label()), h("kbd", null, key));
    fill();
    btn.addEventListener("click", () => copyText(text(), () => { btn.replaceChildren("copied ✓"); setTimeout(fill, 1200); }));
    return btn;
  };
  const copyBtn = copyButton("copy-btn", "C", "your open comments as markdown, for the authoring agent", copyLabel, commentsMarkdown);
  const diffBtns = h("span", "btngrp",
    copyButton("diff-btn", "y", "the diff as the page shows it, expanded context included", () => "copy diff", () => diffText(false)),
    copyButton("diff-ann-btn", "Y", "the same, with your open comments and the agent's notes inline under the lines they are about",
               () => "+ comments", () => diffText(true)));
  const sideBtn = h("button", { cls: "btn", id: "side-btn", onclick: () => toggleSide() }, "tree", h("kbd", null, "b"));
  app.append(h("div", "top",
    h("h1", { title: DATA.title }, DATA.title),
    h("span", "dim", `${TOTALS.files} files`), plusMinus(TOTALS.adds, TOTALS.dels),
    h("span", "dim", h("span", { id: "viewed-count" }, viewedCount()), ` / ${TOTALS.files} viewed`),
    filter, modeChips,
    sideBtn,
    toggle("split-btn", "split", "split", () => rerenderBodies()),
    toggle("wrap-btn", "wrap", "wrap", () => document.body.classList.toggle("wrap", S.wrap)),
    COMMITS ? h("button", { cls: "btn" + (LENS.size || document.body.classList.contains("history-open") ? " on" : ""), id: "hist-btn",
                            title: "the list of commits and the files each one changed. Select commits to see only their changes",
                            onclick: () => toggleHistory() },
      LENS.size ? `${LENS.size} of ${COMMITS} commits` : `${COMMITS} commits`, h("kbd", null, "h")) : null,
    h("button", { cls: "btn", onclick: () => document.getElementById("help").classList.add("open") }, "?"),
    diffBtns, copyBtn));
  if (!SERVED) {
    const dir = DATA.key.replace(/\/[^/]*$/, "");
    const bar = h("div", "readonly",
      h("strong", null, "read-only"),
      " — this page is open as a file, and a file cannot write to disk. Comments need the server: ",
      h("code", null, `diffview --serve ${dir}`),
      " then open the page it prints.",
      h("button", { cls: "rox", title: "dismiss", onclick: () => bar.remove() }, "×"));
    app.append(bar);
  }
  const side = h("div", "side");
  const main = h("div", "main");
  main.addEventListener("mousedown", e => pressAt = [e.clientX, e.clientY]);
  main.addEventListener("click", clickFocus);
  if (LENS.size) main.append(lensBar());
  else if (DATA.summary) {
    const box = h("div", { cls: "summary", html: mdInline(DATA.summary) });
    main.append(box);
    if (SERVED) offerRewrite(box);
  }
  else if (SERVED && DATA.summaryPending) {
    const box = h("div", "summary pending", "writing a summary…");
    main.append(box);
    awaitSummary(box);
  }
  else if (SERVED && ALL.length && sessionStorage.getItem("dv-summary-declined") !== DATA.key) offerSummary(main);
  if (!LENS.size) {
    // a comment written on commits that changed a file the whole range leaves as it was: no card carries it
    const stray = S.comments.filter(c => lensOf(c.fileKey) && !isResolved(c.id) && !RANGE.all.some(x => x.f.key === shownOn(c)));
    if (stray.length) main.append(h("div", "strays", h("div", "eyebrow", "comments on files the full diff does not show"),
      stray.map(c => {
        const sel = runSelection(lensOf(c.fileKey));
        return h("div", { cls: "cbox file", "data-ann": "c" + c.id },
          h("div", "cref", `C${c.id} · ${lensOf(c.fileKey).path} · ${writtenOn(c)}`),
          h("div", "ctext", c.text),
          h("div", "cbtns", h("button", { cls: "btn", ...(sel ? {} : { disabled: "", title: "those commits are no longer in the history" }),
                                          onclick: () => setLens(sel) }, "show those commits")));
      })));
  }
  if (!ALL.length) main.append(h("div", "summary pending", LENS.size ? "the selected commits undo each other, so together they change nothing"
                                                                     : "no changes in the sources yet. The page regenerates when they appear"));
  VIEW.sources.forEach((s, si) => {
    const sAdds = s.files.reduce((n, f) => n + f.adds, 0), sDels = s.files.reduce((n, f) => n + f.dels, 0);
    if (s.run) {
      side.append(h("div", "src eyebrow", `${s.name} · ${s.detail}`), buildTree(s.files, si));
      main.append(h("div", "src-hdr", h("h2", { cls: "mono" }, s.name), h("span", "dim", s.run.length > 1 ? `${s.run.length} commits, as one diff` : s.label),
        churnBar(sAdds, sDels), plusMinus(sAdds, sDels)));
      main.append(runMessage(s.run));
      for (const f of s.files) main.append(fileCard({ s, si, f }));
      return;
    }
    side.append(h("div", "src eyebrow", `${s.label} · ${s.detail}`));
    side.append(buildTree(s.files.filter(changed), si));
    const untouched = s.files.filter(f => !changed(f));
    if (untouched.length) {
      side.append(h("div", { cls: "src eyebrow", title: "files the diff does not touch, shown because an agent note points at them" }, "untouched · noted"));
      side.append(buildTree(untouched, si));
    }
    main.append(h("div", "src-hdr", h("h2", null, s.label), h("span", "dim mono", s.detail),
      churnBar(sAdds, sDels), plusMinus(sAdds, sDels),
      s.commits ? h("span", "dim", `${s.commits.length} commits`) : null));
    for (const f of s.files) main.append(fileCard({ s, si, f }));
  });
  app.append(h("div", "layout", side, main));
  document.body.classList.toggle("wrap", S.wrap);
  const top = app.querySelector(".top");
  TOP_SIZE.disconnect();
  TOP_SIZE.observe(top);
}
// written on the next frame: a write inside the callback relayouts the page mid-observation, which the browser reports as an error
const TOP_SIZE = new ResizeObserver(entries => requestAnimationFrame(() =>
  document.documentElement.style.setProperty("--topbar-h", entries[0].target.offsetHeight + "px")));
/* rebuilds the tree, the cards and the counts for the chosen view, and leaves the history panel alone */
function rerenderApp() {
  exitLineMode();
  clearFocus();
  S.ann = null;
  S.folded.clear();
  CARDS.clear();
  io.disconnect();
  spyCard = null;
  const query = document.getElementById("filter")?.value || "";
  document.getElementById("app").replaceChildren();
  render();
  toggleSide(!document.body.classList.contains("no-side"));
  if (query) { document.getElementById("filter").value = query; applyFilter(); }
  scrollTo(0, 0);
  spySoon();
}
/* the banner at the top of a lens: what it shows, and a button back to the full diff */
function lensBar() {
  const n = LENS.size;
  return h("div", "lensbar",
    h("span", null, h("b", null, `${n} of ${COMMITS} commit${COMMITS === 1 ? "" : "s"} selected.`),
      ` Below are only ${n === 1 ? "its" : "their"} changes. A comment written here shows on its file in the full diff too; the agent's notes on the full diff stay there.`),
    h("button", { cls: "btn", onclick: () => setLens(new Set()) }, "full diff", h("kbd", null, "H")));
}
/* a run's commit messages, the way git show heads its diff: one commit in full, several by subject */
function runMessage(run) {
  if (run.length === 1) {
    const c = run[0];
    return h("div", "src-msg", h("div", "subj", c.subject),
      c.author ? h("div", "dim mono", `${c.author} · ${c.date.replace("T", " ").slice(0, 16)}`) : null,
      c.body ? h("div", "body", c.body) : null);
  }
  return h("div", "src-msg", run.map(c => {
    const line = h("div", "line" + (c.body ? " has-body" : ""), h("span", "fold"), h("span", "mono dim", c.short + "  "), h("span", "t", c.subject));
    if (!c.body) return line;
    const item = h("div", "item", line, h("div", "body", c.body));
    line.addEventListener("click", () => item.classList.toggle("open"));
    return item;
  }));
}
/* the tree: a column beside the diff on a wide window, a slide-over on a narrow one, hidden on request */
const SIDE_OVER = matchMedia("(max-width: 1099px)");
function toggleSide(on = document.body.classList.contains("no-side")) {
  document.body.classList.toggle("no-side", !on);
  document.getElementById("side-btn").classList.toggle("on", on);
}
const sideOver = () => SIDE_OVER.matches && !document.body.classList.contains("no-side");
function closeSideOver() { if (sideOver()) toggleSide(false); }
function rerenderBodies() {
  exitLineMode();
  const draft = takeDraft();
  for (const [key, card] of CARDS) rebuildBody(card);
  focusHunk(S.focus, { scroll: false });
  drawAnn();
  restoreDraft(draft);
}
function rerenderCard(fileKey) {
  exitLineMode();
  const draft = takeDraft();
  rebuildBody(CARDS.get(fileKey));
  focusHunk(S.focus, { scroll: false });
  drawAnn();
  restoreDraft(draft);
}
function rebuildBody(card) {
  const body = card && card.children[1];
  if (!body || !body.dataset.done) return;
  body.replaceChildren();
  delete body.dataset.done;
  card.dispatchEvent(new Event("render"));
}
/* a comment being typed survives a rebuild of the table under it, and a merge that redraws its card:
   text, caret and focus come back as they were */
function takeDraft() {
  const open = document.querySelector(".cbox[data-editing]");
  if (!open) return null;
  const ta = open.querySelector("textarea");
  return {
    ref: { fileKey: open.dataset.fileKey, hi: +open.dataset.hi, side: open.dataset.side,
           start: +open.dataset.start, end: +open.dataset.end,
           ...(open.dataset.re ? { re: +open.dataset.re } : {}) },
    text: ta.value,
    existingId: open.dataset.existingId ? +open.dataset.existingId : null,
    focused: document.activeElement === ta,
    caret: [ta.selectionStart, ta.selectionEnd],
  };
}
function restoreDraft(draft) {
  if (!draft) return;
  ensureRendered(draft.ref.fileKey);
  const existing = draft.existingId ? S.comments.find(c => c.id === draft.existingId) : null;
  if (draft.existingId && !existing) toast(`C${draft.existingId} was deleted in another tab; what you are typing goes on as a new comment`);
  openCommentEditor(draft.ref, existing, draft.text);
  const ta = document.querySelector(".cbox[data-editing] textarea");
  if (!ta) return;
  ta.setSelectionRange(...draft.caret);
  if (!draft.focused) ta.blur();
}
/* the summary is written after the page opens, so it arrives into a slot held for it
   here rather than delaying the whole page behind a model call */
function awaitSummary(box) {
  const deadline = Date.now() + 300000;   // the generator gives up at five minutes; so does this
  const poll = setInterval(async () => {
    if (Date.now() > deadline) { clearInterval(poll); box.remove(); return; }
    const sidecar = await fetchBeside(".summary.json");
    if (!sidecar) return;   // not written yet
    clearInterval(poll);
    const { summary, error } = sidecar;
    if (summary) {
      DATA.summary = summary;
      box.className = "summary";
      box.innerHTML = mdInline(summary);
      if (error) toast("summary not rewritten: " + error);   // the old paragraph came back with the reason
      offerRewrite(box);
    } else if (error) {
      box.textContent = "no summary — " + error;
      offerRewrite(box);
    } else {
      box.remove();
    }
  }, 1500);
}
/* a render that skipped the summary (--no-auto-summary, no --summary) is still watched by
   something that can write one; say so once, dismissable for the life of the tab */
async function offerSummary(main) {
  if (!(await watched())) return;
  const box = h("div", "summary pending", "no summary was written for this render. ",
    h("button", { cls: "lnk", onclick: () => requestSummary(box) }, "write one"),
    h("button", { cls: "rox", title: "dismiss",
      onclick: () => { sessionStorage.setItem("dv-summary-declined", DATA.key); box.remove(); } }, "×"));
  main.prepend(box);
}
async function requestSummary(box) {
  box.className = "summary pending";
  box.textContent = "writing a summary…";
  try {
    if (!(await fetch("/summary", { method: "POST" })).ok) throw new Error();
  } catch (e) { box.textContent = "the watcher is gone; nothing can write the summary"; return; }
  awaitSummary(box);
}
/* only --watch has sources to rerun; --serve answers 404 on /version */
async function watched() {
  if (!FROM_WATCH) return false;
  try { return (await fetch("/version")).ok; } catch (e) { return false; }
}
/* a watched page keeps its first summary for the life of the watch; the ↻ says how far the diff
   has moved since it was written, and asks the watcher for a new one */
async function offerRewrite(box) {
  if (!(await watched())) return;
  const sidecar = await fetchBeside(".summary.json");
  if (!sidecar) return;                       // a summary given by hand: nothing to compare against
  const written = sidecar.for;
  if (!written || !DATA.size) return;
  const moved = Math.abs(DATA.size.adds - written.adds) + Math.abs(DATA.size.dels - written.dels);
  const at = new Date(written.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const title = !sidecar.summary ? "no summary was written. Click to try again."
    : moved ? `written ${at} for +${written.adds} −${written.dels}; the diff is now +${DATA.size.adds} −${DATA.size.dels}. Click to rewrite it for the diff as it is.`
    : `written ${at} for this diff. Click to rewrite it.`;
  const btn = h("button", { cls: "rewrite" + (moved || !sidecar.summary ? " stale" : ""), title,
    onclick: () => requestSummary(box) }, "↻");
  box.append(btn);
}
function mdInline(s) {
  return "<p>" + esc(s).trim()
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|\s)\*([^*\n]+)\*(?=[\s.,;:)]|$)/g, "$1<i>$2</i>")
    .replace(/\n{2,}/g, "</p><p>").replace(/\n/g, " ") + "</p>";
}
loadState().then(() => {
  applyStoredExpand();
  const lens = lensFromHash();   // a reload, --watch's included, comes back to the same lens
  if (lens.size) useLens(lens);
  render();
  toggleSide(!SIDE_OVER.matches);
  renderHistory();
  renderJump();
  renderHelp();
  if (sessionStorage.getItem("dv-history:" + DATA.key)) toggleHistory(true);
  spySoon();
  if (UNSAVED) persist();   // the local copy held a write the file never got: land it, merged with whatever the file gained meanwhile
});

/* ================= served pages: following the file, and watch mode's live reload ================= */
/* file bodies render lazily, so the browser restores a reload into a page that is not
   built yet and lands at the wrong place; carry the offset across ourselves instead */
addEventListener("pagehide", () => sessionStorage.setItem("dv-scroll", scrollY));
const savedScroll = sessionStorage.getItem("dv-scroll");
if (savedScroll != null) {
  sessionStorage.removeItem("dv-scroll");
  requestAnimationFrame(() => scrollTo(0, +savedScroll));
}
if (SERVED) {
  // every 2 seconds in the foreground, at once when the tab comes to the front; a --serve server exits
  // once no page has been heard from for a while, and a background tab is throttled by the browser to
  // about one of these a minute, so an open tab, seen or not, keeps its server
  setInterval(follow, 2000);
  addEventListener("focus", follow);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") follow(); });
}
// only --watch rebuilds a page under you; --serve answers 404 here, and one is enough to stop asking
if (SERVED && FROM_WATCH) {
  const poll = setInterval(async () => {
    try {
      const res = await fetch("/version");
      if (!res.ok) { clearInterval(poll); return; }
      const { g, k } = await res.json();
      if (k && k !== DATA.key) return;          // a different review took over this port; never reload into it
      if (!g || g === DATA.generated) return;   // compare against THIS page's build, no baseline races
      if (document.querySelector(".cbox[data-editing]") || LINE) return;  // never yank a review mid-comment
      if (RETRY) return;   // nor over comments that never reached disk: a restarted --watch rebuilds on sight
      location.reload();
    } catch (e) {}
  }, 2000);
}
</script>
