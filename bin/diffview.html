<!doctype html>
<!-- Template for bin/diffview: tree + side-by-side diff, keyboard-driven,
     line/hunk comments exported as markdown for the authoring agent.
     Press ? for keys. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --bg: #141519; --panel: #1b1d23; --raised: #22252c; --border: #2c303a;
  --ink: #d6dae2; --ink2: #9aa1af; --ink3: #6a7180;
  --accent: #7aa2f7; --accent-dim: #4b689f;
  --comment: #b083d9; --comment-dim: #7a5a9e;
  --comment-bg: #1f1c27; --comment-field: #16141c; --comment-border: #383049;
  --note: #63bfae; --note-dim: #3d7268;
  --note-bg: #1b2023; --note-border: #2f3a3c;
  --border-strong: #3a4050; --toast-bg: #3a1512;
  --add-no: #6f9a72; --del-no: #a8756f;
  --syn-comment: #7c8494; --syn-keyword: #c792c0; --syn-string: #a8c187; --syn-number: #d0a06b;
  --syn-title: #82aaff; --syn-attr: #9fbcd4; --syn-builtin: #86c0b6; --syn-meta: #d9a648;
  --add: #57ab5a; --add-ink: #85d18d; --add-bg: rgba(87,171,90,.13); --add-mark: rgba(87,171,90,.32);
  --del: #e5534b; --del-ink: #f09a90; --del-bg: rgba(229,83,75,.11); --del-mark: rgba(229,83,75,.30);
  --mod: #8fa7c9; --ren: #b083d9;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --topbar-h: 45px;
}
* { box-sizing: border-box; }
html { scrollbar-color: #3a3f4b var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink3); }
.mono { font-family: var(--mono); }
.dim { color: var(--ink2); }

.churn { display: inline-flex; height: 8px; width: 52px; border-radius: 2px; overflow: hidden; background: var(--raised); flex: none; align-self: center; }
.churn i { display: block; height: 100%; }
.churn .ca { background: var(--add); }
.churn .cd { background: var(--del); }

.st { font-family: var(--mono); font-size: 11px; font-weight: 700; width: 16px; height: 16px; line-height: 16px;
      text-align: center; border-radius: 3px; flex: none; align-self: center; }
.st.A { color: var(--add-ink); background: var(--add-bg); }
.st.D { color: var(--del-ink); background: var(--del-bg); }
.st.M { color: var(--mod); background: rgba(143,167,201,.12); }
.st.R { color: var(--ren); background: rgba(176,131,217,.12); }

.adds { color: var(--add-ink); font-family: var(--mono); font-size: 12px; }
.dels { color: var(--del-ink); font-family: var(--mono); font-size: 12px; }

.btn { background: var(--raised); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px;
       cursor: pointer; color: var(--ink2); font-size: 12.5px; white-space: nowrap; }
.btn:hover { color: var(--ink); border-color: var(--border-strong); }
.btn.on { color: var(--accent); border-color: var(--accent-dim); }
.btn kbd { font-family: var(--mono); font-size: 10px; color: var(--ink3); margin-left: 4px; }
input[type=search], textarea { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; color: var(--ink); }
input[type=search]::placeholder { color: var(--ink3); }

/* ---- diff tables ---- */
.diffbody { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; overflow-x: auto; border-radius: 0 0 8px 8px; }
table.diff { border-collapse: collapse; width: 100%; }
table.diff td { padding: 0 8px; white-space: pre; vertical-align: top; }
body.wrap table.diff td.code { white-space: pre-wrap; word-break: break-word; }
td.no { width: 1%; min-width: 46px; text-align: right; color: var(--ink3); user-select: none; font-size: 11px; padding-top: 2px; position: relative; }
td.no[data-no] { cursor: pointer; }
td.no[data-no]::before { content: "+"; position: absolute; left: 3px; top: 1px; font-weight: 700; color: var(--comment); opacity: 0; }
table.diff tr:hover td.no[data-no]::before { opacity: .95; }
td.no[data-no]:hover { color: var(--comment); background: rgba(176,131,217,.16) !important; }
td.no.csel { background: rgba(176,131,217,.25) !important; color: var(--comment); }
td.no.lcur { outline: 2px solid var(--comment); outline-offset: -2px; }
input[type=checkbox] { accent-color: var(--accent); }
td.code { width: 49%; }
tr.add td.code, tr.add td.no { background: var(--add-bg); }
tr.del td.code, tr.del td.no { background: var(--del-bg); }
tr.add td.no { color: var(--add-no); } tr.del td.no { color: var(--del-no); }
td.code mark { background: transparent; color: inherit; border-radius: 2px; }
tr.add mark { background: var(--add-mark); } tr.del mark { background: var(--del-mark); }
tr.hunkhdr td { background: var(--raised); color: var(--ink3); font-size: 11px; padding: 3px 12px; }
tr.gap td { color: var(--ink3); font-size: 11px; text-align: center; background: var(--panel); padding: 2px; user-select: none; }
tbody.hunk.focus { outline: 2px solid var(--accent-dim); outline-offset: -2px; }
.fhead.focus-file { outline: 2px solid var(--accent-dim); outline-offset: -2px; }
#toast { position: fixed; bottom: 14px; left: 14px; z-index: 200; background: var(--toast-bg); border: 1px solid var(--del);
  color: var(--del-ink); border-radius: 8px; padding: 8px 14px; font-size: 12.5px; max-width: 480px; display: none; }
.chip { background: none; border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px; cursor: pointer;
  color: var(--ink3); font-size: 11.5px; }
.chip.on { color: var(--accent); border-color: var(--accent-dim); }

/* hljs — quiet palette so diff colors stay the loudest thing */
.hljs-comment, .hljs-quote { color: var(--syn-comment); font-style: italic; }
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-type { color: var(--syn-keyword); }
.hljs-string, .hljs-regexp { color: var(--syn-string); }
.hljs-number, .hljs-symbol { color: var(--syn-number); }
.hljs-title, .hljs-name, .hljs-function .hljs-title { color: var(--syn-title); }
.hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable { color: var(--syn-attr); }
.hljs-built_in, .hljs-builtin-name { color: var(--syn-builtin); }
.hljs-meta, .hljs-section { color: var(--syn-meta); }
.hljs-subst { color: inherit; }

/* ---- comments ---- */
tr.crow > td, tr.arow > td { padding: 0; white-space: normal; }
.cbox { margin: 6px 8px 10px 48px; max-width: 720px; background: var(--comment-bg); border: 1px solid var(--comment-border);
        border-left: 3px solid var(--comment); border-radius: 8px; padding: 8px 12px; font-family: var(--sans); }
.cbox .cref { font-family: var(--mono); font-size: 11px; color: var(--comment); opacity: .85; margin-bottom: 5px; }
.cbox .ctext { font-size: 13px; white-space: pre-wrap; }
.cbox textarea { width: 100%; min-height: 46px; font-size: 13px; background: var(--comment-field); border-color: var(--comment-border); }
.cbox .cbtns { display: flex; gap: 6px; margin-top: 8px; justify-content: flex-end; }
.cbox .btn:hover { border-color: var(--comment-dim); }
.cbox .btn.on { color: var(--comment); border-color: var(--comment-dim); }
/* resolved collapses to one dim line — present enough to say "handled, here", cheap enough to scroll past */
.cbox.resolved { opacity: .5; border-left-color: var(--comment-dim); margin: 2px 8px 2px 48px; padding: 1px 12px; }
.cbox.resolved .ctext, .cbox.resolved .cbtns { display: none; }
.cbox.resolved .cref { margin-bottom: 0; }
.cbox.focus-ann, .abox.focus-ann { outline: 2px solid var(--accent); outline-offset: 2px; opacity: 1; }
.cbox.resolved.focus-ann { padding: 8px 12px; }       /* reachable by id means readable once you get there */
.cbox.resolved.focus-ann .ctext { display: block; }
.cbox.resolved.focus-ann .cref { margin-bottom: 5px; }
#copy-btn { color: var(--comment); border-color: var(--comment-dim); }
#copy-btn:hover { color: #c9a4e8; border-color: var(--comment); }

/* ---- agent notes (display-only, from --notes) ---- */
.abox { margin: 6px 8px 10px 48px; max-width: 720px; background: var(--note-bg); border: 1px solid var(--note-border);
        border-left: 3px solid var(--note); border-radius: 8px; padding: 8px 12px; font-family: var(--sans); }
.abox .aref { display: flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 11px;
              color: var(--note); margin-bottom: 5px; }
.abox .badge { background: var(--note-dim); color: #dff5ef; font-size: 9.5px; font-weight: 700;
               letter-spacing: .1em; text-transform: uppercase; padding: 1px 7px; border-radius: 4px; }
.abox .atext { font-size: 13px; }
.abox .atext p { margin: .2em 0; }
.abox .atext code { font-family: var(--mono); font-size: .9em; background: rgba(99,191,174,.12); border-radius: 4px; padding: 0 4px; }
.abox.file { margin: 10px 12px; }
.cbox.file { margin: 10px 12px; }
.fhead .acount { font-size: 11px; color: var(--note); }
body.hide-notes tr.arow, body.hide-notes .abox.file { display: none; }

/* ---- file card ---- */
.fcard { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); margin: 0 0 14px; }
.fcard.viewed > .fhead { opacity: .55; }
.fhead { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--raised);
         position: sticky; top: var(--topbar-h); z-index: 3; cursor: pointer; border-bottom: 1px solid var(--border);
         border-radius: 8px 8px 0 0; }
.fhead .path { font-family: var(--mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fhead .path b { font-weight: 600; color: var(--ink); }
.fhead .path span { color: var(--ink2); }
.fhead .spacer { flex: 1; }
.fhead label { display: flex; gap: 5px; align-items: center; font-size: 11.5px; color: var(--ink3); cursor: pointer; }
.fhead .ccount { font-size: 11px; color: var(--comment); }
.fcard.collapsed .diffbody { display: none; }
.binmsg { padding: 10px 14px; color: var(--ink3); font-size: 12.5px; }

/* ---- layout ---- */
.top { position: sticky; top: 0; z-index: 10; display: flex; gap: 10px; align-items: center; height: var(--topbar-h);
  padding: 0 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--border); }
.top h1 { font-size: 14px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 26vw; }
.layout { display: grid; grid-template-columns: 300px minmax(0,1fr); }
.side { position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); overflow-y: auto;
  padding: 10px 6px 80px; border-right: 1px solid var(--border); font-size: 12.5px; }
.side .src { margin: 10px 6px 4px; }
.tree-dir { color: var(--ink2); padding: 2px 6px; cursor: pointer; user-select: none; }
.tree-dir::before { content: "▾ "; font-size: 9px; color: var(--ink3); }
.tree-dir.closed::before { content: "▸ "; }
.tree-kids { margin-left: 12px; border-left: 1px solid var(--border); padding-left: 4px; }
.tree-dir.closed + .tree-kids { display: none; }
.tree-file { display: flex; gap: 6px; align-items: center; padding: 2px 6px; border-radius: 5px; cursor: pointer; font-family: var(--mono); font-size: 11.5px; }
.tree-file:hover { background: var(--raised); }
.tree-file.viewed { opacity: .45; }
.tree-file .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-file .churn { width: 34px; height: 6px; }
.main { padding: 14px 18px 60vh; min-width: 0; }
.summary { max-width: 78ch; font-size: 14px; line-height: 1.6; color: var(--ink); background: var(--panel);
  border: 1px solid var(--border); border-radius: 8px; padding: 4px 16px; margin: 0 auto 16px; }
.summary code { font-family: var(--mono); font-size: .9em; background: var(--raised); border-radius: 4px; padding: 1px 5px; }
.src-hdr { margin: 26px 0 10px; display: flex; gap: 10px; align-items: baseline; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.src-hdr h2 { font-size: 16px; margin: 0; }
.hidden { display: none !important; }

/* ---- commits panel ---- */
#commits { position: fixed; top: var(--topbar-h); right: 0; bottom: 0; width: min(460px, 44vw); background: var(--panel);
  border-left: 1px solid #3a4050; box-shadow: -10px 0 30px rgba(0,0,0,.45); z-index: 20; overflow-y: auto;
  padding: 12px 14px 60px; display: none; }
#commits.open { display: block; }
.cm { border-bottom: 1px solid var(--border); padding: 10px 2px; }
.cm .meta { display: flex; gap: 10px; font-family: var(--mono); font-size: 11px; color: var(--ink3); }
.cm h3 { margin: 3px 0 2px; font-size: 13.5px; }
.cm .body { color: var(--ink2); font-size: 12.5px; white-space: pre-wrap; display: none; margin: 4px 0; }
.cm.open .body { display: block; }
.cm .cstat { display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--ink2); flex-wrap: wrap; margin-top: 3px; }
.cm .fchip { font-family: var(--mono); font-size: 10.5px; background: var(--raised); border: 1px solid var(--border);
  border-radius: 4px; padding: 0 6px; color: var(--ink2); cursor: pointer; border-width: 1px; }
.cm .fchip:hover { color: var(--ink); }

/* ---- overlays: the help sheet and the Ctrl+K jump prompt ---- */
#help, #jump { position: fixed; inset: 0; z-index: 100; background: rgba(10,11,13,.7); display: none; justify-content: center; }
#help { align-items: center; }
#jump { align-items: flex-start; z-index: 110; background: rgba(10,11,13,.55); }
#help.open, #jump.open { display: flex; }
#help .card, #jump .card { background: var(--panel); border: 1px solid var(--border-strong); border-radius: 10px;
  padding: 20px 26px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
#jump .card { margin-top: 18vh; padding: 14px 18px; width: min(420px, 86vw); }
#jump input { width: 100%; margin-top: 8px; font-family: var(--mono); }
#help table { border-collapse: collapse; font-size: 13px; }
#help td { padding: 3px 14px 3px 0; }
#help kbd { font-family: var(--mono); background: var(--raised); border: 1px solid var(--border); border-radius: 4px; padding: 1px 7px; font-size: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="commits"></div>
<div id="jump"></div>
<div id="help"></div>
<div id="toast"></div>
<script>__HLJS__</script>
<script>
"use strict";
const DATA = "__DATA__";

/* ================= state ================= */
DATA.sources.forEach((s, si) => s.files.forEach(f => { f.key = si + ":" + f.path; }));
const ALL = DATA.sources.flatMap((s, si) => s.files.map(f => ({ s, si, f })));
const HUNKS = ALL.flatMap(x => x.f.hunks.map((hk, hi) => ({ x, hk, hi })));
const TOTALS = {
  files: ALL.length,
  adds: ALL.reduce((n, x) => n + x.f.adds, 0),
  dels: ALL.reduce((n, x) => n + x.f.dels, 0),
  commits: DATA.sources.reduce((n, s) => n + (s.commits ? s.commits.length : 0), 0),
};
const NOTES = new Map();  // fileKey -> agent notes from --notes, each carrying the anchor it resolved to
for (const n of DATA.notes || []) {
  const matches = ALL.filter(x => x.f.path === n.path || x.f.path.endsWith("/" + n.path));
  if (!matches.length) continue;
  const side = n.side === "old" ? "old" : "new";
  const hunkOf = x => n.line == null ? -1
    : x.f.hunks.findIndex(hk => hk.lines.some(ln => (side === "new" ? ln[2] : ln[1]) === n.line));
  const x = matches.find(m => hunkOf(m) >= 0) || matches[0];   // same path in two sources: prefer the one holding the line
  n.side = side;
  n.fileKey = x.f.key;
  n.hi = hunkOf(x);
  if (!NOTES.has(x.f.key)) NOTES.set(x.f.key, []);
  NOTES.get(x.f.key).push(n);
}
const STORE_KEY = "diffview:" + DATA.sources.map(s => s.label + "@" + s.detail).join("+");
// review state: newest of the browser's copy and the state baked in by a --watch rebuild
const localState = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
const bakedState = DATA.saved || null;
const stored = (localState && bakedState)
  ? ((localState.savedAt || 0) >= (bakedState.savedAt || 0) ? localState : bakedState)
  : (localState || bakedState || {});
const AGENT_RESOLVED = new Set(DATA.agentResolved || []);
const S = {
  split: true, wrap: true, filterMode: "path",
  viewed: new Set(stored.viewed || []),
  comments: stored.comments || [],   // {id, fileKey, hi, side:'old'|'new'|'hunk', start, end, text, excerpt, re?}
  focus: -1,                          // index into HUNKS
  ann: null,                          // focused annotation: {kind:'note'|'comment', id}
  verdict: new Map(stored.verdict || []),     // comment id -> your resolve call, only where it differs from the agent's
  undo: null,                         // last deleted comment, restorable with u (session-only)
  nextId: stored.nextId || 1,
};
function persist() {
  const blob = { key: STORE_KEY, savedAt: Date.now(), viewed: [...S.viewed], comments: S.comments, nextId: S.nextId,
                 verdict: [...S.verdict] };
  localStorage.setItem(STORE_KEY, JSON.stringify(blob));
  if (location.protocol.startsWith("http"))
    fetch("/state", { method: "POST", body: JSON.stringify(blob) }).catch(() => {});  // saved beside the page, baked in on rebuild
}

/* ================= tiny DOM helper ================= */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (typeof attrs === "string") el.className = attrs;
  else if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === "cls") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(9)) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.style.display = "none", 8000);
}
window.addEventListener("error", e => toast("JS error: " + e.message));
window.addEventListener("unhandledrejection", e => toast("JS error: " + (e.reason && e.reason.message || e.reason)));
function copyText(t, onDone) {
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = t; document.body.append(ta); ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    if (ok) onDone();
    else toast("copy failed: clipboard is blocked here; run copy(commentsMarkdown()) in the browser console");
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(onDone, fallback);
  else fallback();
}
const STATUS = { added: "A", deleted: "D", modified: "M", renamed: "R" };
const CHURN_MAX = Math.max(...ALL.map(x => x.f.adds + x.f.dels), 1);
function churnBar(adds, dels) {
  const total = adds + dels || 1;
  const w = Math.max(0.08, Math.sqrt(total / CHURN_MAX));
  const bar = h("span", "churn");
  bar.style.width = Math.round(52 * Math.min(1, w)) + "px";
  bar.append(h("i", { cls: "ca", style: `width:${(100 * adds / total).toFixed(1)}%` }),
             h("i", { cls: "cd", style: `width:${(100 * dels / total).toFixed(1)}%` }));
  bar.title = `+${adds} −${dels}`;
  return bar;
}
function stat(f) { return h("span", { cls: "st " + STATUS[f.status], title: f.status }, STATUS[f.status]); }
function plusMinus(a, d) { return h("span", { style: "white-space:nowrap" }, h("span", "adds", "+" + a), " ", h("span", "dels", "−" + d)); }

/* ================= syntax highlight + word marks ================= */
function hlHtml(text, lang) {
  if (text === "") return "";
  if (window.hljs && lang && hljs.getLanguage(lang)) {
    try { return hljs.highlight(text, { language: lang, ignoreIllegals: true }).value; } catch (e) {}
  }
  return esc(text);
}
function applyMarks(el, ranges) {
  if (!ranges.length) return;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const nodes = []; let n;
  while ((n = walker.nextNode())) nodes.push(n);
  let pos = 0;
  for (const node of nodes) {
    const len = node.textContent.length, nodeStart = pos, nodeEnd = pos + len;
    pos = nodeEnd;
    for (const [s, e] of ranges) {
      const a = Math.max(s, nodeStart), b = Math.min(e, nodeEnd);
      if (a >= b) continue;
      const range = document.createRange();
      range.setStart(node, a - nodeStart); range.setEnd(node, b - nodeStart);
      const mark = document.createElement("mark");
      try { range.surroundContents(mark); } catch (err) { continue; }
      break;
    }
  }
}
function wordDiff(a, b) {
  const tok = s => { const out = []; const re = /\w+|\s+|[^\w\s]/g; let m; while ((m = re.exec(s))) out.push([m[0], m.index]); return out; };
  let ta = tok(a), tb = tok(b);
  let p = 0; while (p < ta.length && p < tb.length && ta[p][0] === tb[p][0]) p++;
  let q = 0; while (q < ta.length - p && q < tb.length - p && ta[ta.length - 1 - q][0] === tb[tb.length - 1 - q][0]) q++;
  const ma = ta.slice(p, ta.length - q), mb = tb.slice(p, tb.length - q);
  const span = t => t.length ? [[t[0][1], t[t.length - 1][1] + t[t.length - 1][0].length]] : [];
  if (ma.length * mb.length > 40000) return [span(ma), span(mb)];
  const dp = Array.from({ length: ma.length + 1 }, () => new Uint16Array(mb.length + 1));
  for (let i = ma.length - 1; i >= 0; i--) for (let j = mb.length - 1; j >= 0; j--)
    dp[i][j] = ma[i][0] === mb[j][0] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ra = [], rb = []; let i = 0, j = 0;
  const push = (arr, t) => { const end = t[1] + t[0].length;
    if (arr.length && arr[arr.length - 1][1] >= t[1]) arr[arr.length - 1][1] = end; else arr.push([t[1], end]); };
  while (i < ma.length && j < mb.length) {
    if (ma[i][0] === mb[j][0]) { i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) push(ra, ma[i++]);
    else push(rb, mb[j++]);
  }
  while (i < ma.length) push(ra, ma[i++]);
  while (j < mb.length) push(rb, mb[j++]);
  return [ra, rb];
}

/* ================= diff rendering ================= */
function pairHunk(hunk) {
  const rows = []; let dels = [], adds = [];
  const flush = () => {
    const n = Math.max(dels.length, adds.length);
    for (let k = 0; k < n; k++) rows.push({ del: dels[k] || null, add: adds[k] || null });
    dels = []; adds = [];
  };
  for (const ln of hunk.lines) {
    if (ln[0] === 2) dels.push(ln);
    else if (ln[0] === 1) adds.push(ln);
    else { flush(); rows.push({ ctx: ln }); }
  }
  flush();
  return rows;
}
function codeCell(text, lang, ranges) {
  const td = h("td", { cls: "code", html: hlHtml(text, lang) });

}
function noCell(side, no) {
  const td = h("td", "no", no == null ? "" : no);
  if (no != null) { td.dataset.side = side; td.dataset.no = no; td.title = "comment on this line (shift-click to end a range)"; }
  return td;
}
const emptyHatch = "repeating-linear-gradient(45deg, transparent 0 6px, rgba(255,255,255,.015) 6px 12px)";

function renderDiff(file) {
  const cols = S.split ? 4 : 3;
  const wrap = h("div", "diffbody");
  const table = h("table", "diff");
  wrap.append(table);
  table.addEventListener("click", e => {
    const td = e.target.closest("td.no");
    if (td && td.dataset.no) gutterClick(file, td, e.shiftKey);
  });
  file.hunks.forEach((hunk, hi) => {
    const tbody = h("tbody", { cls: "hunk", "data-key": file.key, "data-hi": hi, "data-cols": cols });
    table.append(tbody);
    if (hi > 0) {
      const prev = file.hunks[hi - 1], last = prev.lines[prev.lines.length - 1];
      const gap = hunk.ns - ((last && last[2]) ? last[2] + 1 : hunk.ns);
      if (gap > 0) tbody.append(h("tr", "gap", h("td", { colspan: cols }, `⋯ ${gap} unchanged lines`)));
    }
    tbody.append(h("tr", "hunkhdr", h("td", { colspan: cols },
      `@@ −${hunk.os} +${hunk.ns}` + (hunk.header ? "  " + hunk.header : ""))));
    for (const row of pairHunk(hunk)) {
      if (row.ctx) {
        const [, oNo, nNo, text] = row.ctx;
        if (S.split) tbody.append(h("tr", null, noCell("old", oNo), codeCell(text, file.lang), noCell("new", nNo), codeCell(text, file.lang)));
        else tbody.append(h("tr", null, noCell("old", oNo), noCell("new", nNo), codeCell(text, file.lang)));
        continue;
      }
      let rd = [], ra = [];
      if (row.del && row.add) [rd, ra] = wordDiff(row.del[3], row.add[3]);
      if (S.split) {
        const tr = h("tr", "split",
          noCell("old", row.del ? row.del[1] : null),
          row.del ? codeCell(row.del[3], file.lang, rd) : h("td", "code"),
          noCell("new", row.add ? row.add[2] : null),
          row.add ? codeCell(row.add[3], file.lang, ra) : h("td", "code"));
        const [noL, codeL, noR, codeR] = tr.children;
        if (row.del) { noL.style.background = "var(--del-bg)"; codeL.style.background = "var(--del-bg)"; noL.style.color = "var(--del-no)";
                       codeL.querySelectorAll("mark").forEach(m => m.style.background = "var(--del-mark)"); }
        else codeL.style.background = emptyHatch;
        if (row.add) { noR.style.background = "var(--add-bg)"; codeR.style.background = "var(--add-bg)"; noR.style.color = "var(--add-no)";
                       codeR.querySelectorAll("mark").forEach(m => m.style.background = "var(--add-mark)"); }
        else codeR.style.background = emptyHatch;
        tbody.append(tr);
      } else {
        if (row.del) tbody.append(h("tr", "del", noCell("old", row.del[1]), h("td", "no"), codeCell(row.del[3], file.lang, rd)));
        if (row.add) tbody.append(h("tr", "add", h("td", "no"), noCell("new", row.add[2]), codeCell(row.add[3], file.lang, ra)));
      }
    }
  });
  return wrap;
}

/* ================= comments ================= */
function gutterClick(file, td, shift) {
  exitLineMode();
  const side = td.dataset.side, no = +td.dataset.no;
  const tbody = td.closest("tbody.hunk");
  const hi = +tbody.dataset.hi;

    const start = Math.min(+openBox.dataset.start, no), end = Math.max(+openBox.dataset.start, no);
    openBox.dataset.start = start; openBox.dataset.end = end;
    openBox.querySelector(".cref").textContent = editorRef(file, { side, start, end },
      openBox.dataset.re ? +openBox.dataset.re : null, openBox.dataset.existingId ? +openBox.dataset.existingId : null);
    highlightSel(tbody, side, start, end);

  }
  if (openBox) {
    if (openBox.querySelector("textarea").value.trim()) { openBox.querySelector("textarea").focus(); return; }
    openBox.closest("tr.crow").remove();

function editorRef(file, ref, re, existingId) {
  return (existingId != null ? `C${existingId} · ` : "") + refLabel(file, ref.side, ref.start, ref.end)
       + (re != null ? ` · re A${re}` : "");
}
function refLabel(file, side, start, end) {
  const tag = side === "hunk" ? "hunk" : (side === "old" ? "old" : "new") + " L" + start + (end !== start ? "–" + end : "");
  return file.path + " · " + tag;
}
function excerptFor(file, hi, side, start, end) {
  if (side === "hunk") return ["@@ −" + file.hunks[hi].os + " +" + file.hunks[hi].ns + " " + (file.hunks[hi].header || "")];
  const out = [];
  for (const ln of file.hunks[hi].lines) {

  if (!tbody) return [null, null];
  if (side === "hunk") return [tbody, tbody.querySelector("tr.hunkhdr")];
  let best = tbody.querySelector("tr.hunkhdr");
  for (const td of tbody.querySelectorAll(`td.no[data-side="${side}"]`))

}

  tbody.querySelectorAll("td.no.csel").forEach(td => td.classList.remove("csel"));

    if (+td.dataset.no >= start && +td.dataset.no <= end) td.classList.add("csel");
}

  if (!row) return;
  if (existing) document.querySelectorAll(`tr.crow[data-cid="${existing.id}"]`).forEach(el => el.remove());
  highlightSel(tbody, ref.side, ref.start, ref.end);
  const re = existing ? existing.re : ref.re;
  const box = h("div", { cls: "cbox", "data-editing": "1", "data-file-key": ref.fileKey, "data-hi": ref.hi,
                         "data-side": ref.side, "data-start": ref.start, "data-end": ref.end,
                         ...(re != null ? { "data-re": re } : {}),

  ta.value = draft != null ? draft : existing ? existing.text : "";
  const save = () => {

    const start = +box.dataset.start, end = +box.dataset.end;
    const excerpt = excerptFor(file, ref.hi, ref.side, start, end);

      if (re != null) c.re = re;

    tr.remove();
    tbody.querySelectorAll("td.no.csel").forEach(td => td.classList.remove("csel"));
    deleteComment(existing);

    e.stopPropagation();
    if (e.key === "Enter" && e.ctrlKey) save();

    h("div", "cbtns",
      existing ? h("button", { cls: "btn", onclick: dropExisting }, "delete") : null,
      h("button", { cls: "btn", onclick: cancel }, "cancel"),
      h("button", { cls: "btn on", onclick: save }, "save")));
  const tr = h("tr", "crow", h("td", { colspan: tbody.dataset.cols }, box));

function commentRef(f, c) {

}

/* agent notes: display-only boxes, anchored like comments but never exported */
function placeNotes(f, body) {

    const box = noteEl(n);
    const [tbody, row] = n.hi < 0 ? [null, null] : anchorRow(f.key, n.hi, n.side, n.end || n.line);

function noteEl(n) {

/* resolved: addressed, not gone — folded away and out of the export, still reachable by id.
   The agent claims resolutions in its own file and S.verdict holds only the ids where you
   disagreed, so your call survives a rebuild and agreeing again leaves no trace to go stale. */

  if (want === AGENT_RESOLVED.has(c.id)) S.verdict.delete(c.id);

  refreshCommentViews(c.fileKey);
}
function deleteComment(c) {

  if (S.ann && S.ann.kind === "comment" && S.ann.id === c.id) S.ann = null;
  persist();

}
function unresolvedCount() { return S.comments.filter(c => !isResolved(c.id)).length; }

function refreshCommentViews(fileKey) {
  const card = CARDS.get(fileKey);
  if (card) {
    card.querySelectorAll("tr.crow").forEach(tr => tr.remove());
    card.querySelectorAll(".cbox.file").forEach(el => el.remove());
    for (const c of S.comments.filter(cc => cc.fileKey === fileKey)) placeComment(c);
    const n = S.comments.filter(cc => cc.fileKey === fileKey && !isResolved(cc.id)).length;
    const cc = card.querySelector(".ccount");
    if (cc) { cc.textContent = `💬 ${n}`; cc.classList.toggle("hidden", !n); }

function copyLabel() { const n = unresolvedCount(); return `copy ${n} comment${n === 1 ? "" : "s"}`; }
function commentsMarkdown() {
  const out = [`# review comments: ${DATA.title}`, "",
    "Refs: \"new\" = the file as changed, \"old\" = before the change (removed lines). " +
    "Line numbers may have drifted since review; the quoted excerpt is the anchor. Locate by excerpt.",
    "",
    "Each comment carries an id (C4). Name it when you answer, and list the ones you have addressed " +
    "as \"resolved\": [\"C4\"] in your notes file — they fold away in the page and stop coming back here. " +
    "A \"re A3\" marks a reply to your own note A3.", ""];
  const emit = (c, label) => {
    out.push(`- **C${c.id}** · ${label}${c.re != null ? ` · re A${c.re}` : ""}`);
    out.push("  ```");
    for (const ln of c.excerpt) out.push("  " + ln);
    out.push("  ```");
    out.push("  " + c.text.replace(/\n/g, "\n  "), "");
  };
  const seen = new Set();
  for (const x of ALL) {
    const cs = S.comments.filter(c => c.fileKey === x.f.key && !isResolved(c.id));
    if (!cs.length) continue;
    out.push(`## ${x.s.label} · ${x.f.path}`, "");
    for (const c of cs.sort((a, b) => a.hi - b.hi || a.start - b.start)) {
      seen.add(c.id);
      const hk = x.f.hunks[c.hi];
      const where = c.side === "hunk"
        ? (hk ? `hunk @@ −${hk.os} +${hk.ns}` : "hunk (from an earlier version of this diff)")
        : `${c.side} line ${c.start}${c.end !== c.start ? "–" + c.end : ""}`;
      emit(c, where);
    }
  }
  const orphans = S.comments.filter(c => !seen.has(c.id) && !isResolved(c.id));
  if (orphans.length) {
    out.push("## comments from an earlier version of this diff (file no longer in range)", "");
    for (const c of orphans) emit(c, c.fileKey.replace(/^\d+:/, "") + (c.side === "hunk" ? " · hunk" : ` · ${c.side} line ${c.start}`));
  }
  return out.join("\n");
}

/* ================= annotations: navigating the agent's notes and your comments ================= */
const annKey = (kind, id) => (kind === "note" ? "a" : "c") + id;
const findNote = id => [...NOTES.values()].flat().find(n => n.id === id);
const findComment = id => S.comments.find(c => c.id === id);

// document order, one entry per annotation; the same list backs n/m motion and the Ctrl+K jump
function annList(opts) {
  const { kind = "all", withResolved = false, withHidden = false } = opts || {};
  const out = [];
  for (const x of ALL) {
    const card = CARDS.get(x.f.key);
    if (!withHidden && card && card.classList.contains("hidden")) continue;
    const inFile = [];
    if (kind !== "comment")
      for (const n of NOTES.get(x.f.key) || [])
        inFile.push({ kind: "note", obj: n, fileKey: x.f.key, hi: n.hi, at: n.line || 0 });
    if (kind !== "note")
      for (const c of S.comments.filter(c => c.fileKey === x.f.key))
        if (withResolved || !isResolved(c.id))
          inFile.push({ kind: "comment", obj: c, fileKey: x.f.key, hi: c.hi, at: c.start });
    inFile.sort((a, b) => a.hi - b.hi || a.at - b.at);   // file-level ones (hi -1) first, as they render
    out.push(...inFile);
  }
  return out;
}
/* Motion is over document position, never over an index into the ring being walked: where you
   stand is routinely absent from that ring — a comment you just resolved, or a note while m
   walks comments — and an index lookup that misses would send you back to the top. */
function moveAnn(dir, kind) {
  const ring = annList({ kind });
  if (!ring.length) return;
  const everything = annList({ withResolved: true, withHidden: true });
  const order = new Map(everything.map((a, i) => [annKey(a.kind, a.obj.id), i]));
  const here = S.ann && order.has(annKey(S.ann.kind, S.ann.id))

function buildTree(files, si) {

    (node.__files ||= []).push(f);
  }
  const build = node => {
    const box = h("div", null);
    for (const [name, kid] of Object.entries(node).filter(([k]) => k !== "__files").sort()) {
      const dir = h("div", "tree-dir", name + "/");
      dir.addEventListener("click", () => dir.classList.toggle("closed"));
      box.append(dir, h("div", "tree-kids", build(kid)));
    }
    for (const f of node.__files || []) {
      const row = h("div", { cls: "tree-file" + (S.viewed.has(f.key) ? " viewed" : ""), "data-key": f.key, title: f.path },
        stat(f), h("span", "nm", f.path.split("/").pop()), churnBar(f.adds, f.dels));
      row.addEventListener("click", () => {
        const card = ensureRendered(f.key);

    TOTALS.commits ? h("button", { cls: "btn", onclick: () => document.getElementById("commits").classList.toggle("open") },
      `${TOTALS.commits} commits`, h("kbd", null, "h")) : null,
    h("button", { cls: "btn", onclick: () => document.getElementById("help").classList.add("open") }, "?"),
    copyBtn));
  const side = h("div", "side");
  const main = h("div", "main");
  if (DATA.summary) main.append(h("div", { cls: "summary", html: mdInline(DATA.summary) }));
  DATA.sources.forEach((s, si) => {
    const sAdds = s.files.reduce((n, f) => n + f.adds, 0), sDels = s.files.reduce((n, f) => n + f.dels, 0);
    side.append(h("div", "src eyebrow", `${s.label} · ${s.detail}`));
    side.append(buildTree(s.files, si));
    main.append(h("div", "src-hdr", h("h2", null, s.label), h("span", "dim mono", s.detail),
      churnBar(sAdds, sDels), plusMinus(sAdds, sDels),
      s.commits ? h("span", "dim", `${s.commits.length} commits`) : null));
    for (const f of s.files) main.append(fileCard({ s, si, f }));
  });
  app.append(h("div", "layout", side, main));
  document.body.classList.toggle("wrap", S.wrap);
  renderCommits();
  renderJump();
  renderHelp();
}
function rerenderBodies() {
  exitLineMode();
  const open = document.querySelector(".cbox[data-editing]");
  const draft = open ? {
    ref: { fileKey: open.dataset.fileKey, hi: +open.dataset.hi, side: open.dataset.side,
           start: +open.dataset.start, end: +open.dataset.end,
           ...(open.dataset.re ? { re: +open.dataset.re } : {}) },
    text: open.querySelector("textarea").value,
    existingId: open.dataset.existingId ? +open.dataset.existingId : null,
  } : null;
  for (const [key, card] of CARDS) {
    const body = card.children[1];
    if (!body.dataset.done) continue;
    body.replaceChildren();
    delete body.dataset.done;
    card.dispatchEvent(new Event("render"));
  }
  focusHunk(S.focus, { scroll: false });
  drawAnn();
  if (draft) {
    ensureRendered(draft.ref.fileKey);
    const existing = draft.existingId ? S.comments.find(c => c.id === draft.existingId) : null;
    openCommentEditor(draft.ref, existing, draft.text);
  }
}
function mdInline(s) {
  return "<p>" + esc(s).trim()
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|\s)\*([^*\n]+)\*(?=[\s.,;:)]|$)/g, "$1<i>$2</i>")
    .replace(/\n{2,}/g, "</p><p>").replace(/\n/g, " ") + "</p>";
}
render();

/* ================= watch mode (only when served by `diffview --watch`) ================= */
const savedScroll = sessionStorage.getItem("dv-scroll");
if (savedScroll != null) {
  sessionStorage.removeItem("dv-scroll");
  requestAnimationFrame(() => scrollTo(0, +savedScroll));
}
if (location.protocol.startsWith("http")) {
  setInterval(async () => {
    try {
      const { g, k } = await (await fetch("/version")).json();
      if (k && k !== STORE_KEY) return;         // a different review took over this port; never reload into it
      if (!g || g === DATA.generated) return;   // compare against THIS page's build, no baseline races
      if (document.querySelector(".cbox[data-editing]") || LINE) return;  // never yank a review mid-comment
      sessionStorage.setItem("dv-scroll", scrollY);
      location.reload();
    } catch (e) {}
  }, 2000);
}
</script>
