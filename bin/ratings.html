<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ratings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* The house tokens (mx house-style), the ones this page uses. */
:root {
  color-scheme: light dark;
  --ground: light-dark(#f4e4cd, #14110e);
  --ground-2: light-dark(#eddabe, #1b1713);
  --edge: light-dark(#cfbca3, #463f37);
  --muted: light-dark(#5e5650, #b0a89e);
  --body: light-dark(#37261d, #ede3d2);
  --strong: light-dark(#22140b, #faf2dc);
  --accent: light-dark(#426724, #75a252);
  --accent-2: light-dark(#674806, #cdb78a);
  --wash: light-dark(rgb(66 103 36 / 0.16), rgb(117 162 82 / 0.22));
  --wash-ink: color-mix(in srgb, var(--muted) 6%, transparent);
  --font-body: "Newsreader", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --radius: 6px;
}
[data-theme="day"] { color-scheme: light; }
[data-theme="night"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: flex; flex-direction: column; overflow: hidden;
  background: var(--ground); color: var(--body);
  font: 400 19px / 1.62 var(--font-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
.v-meta { font-family: var(--font-mono); font-size: 0.8125rem; line-height: 1.5; color: var(--muted); font-variant-numeric: tabular-nums; }

/* How much of the folder is rated, drawn as a hairline along the top. */
#progress { height: 2px; background: var(--edge); }
#progress > div { height: 100%; width: 0; background: var(--muted); transition: width 200ms; }
header { display: flex; justify-content: space-between; align-items: baseline; padding: 0.9rem 1.5rem 0; }

main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
       gap: 1.25rem; padding: 0.5rem 1.5rem calc(1.5rem + env(safe-area-inset-bottom)); }

#card { display: flex; align-items: center; gap: 1rem; }
.step { width: 2.5rem; height: 2.5rem; border: 0; background: none; color: var(--edge); cursor: pointer; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; transition: color 150ms; }
.step:hover { color: var(--muted); }
.step svg { width: 1.25rem; height: 1.25rem; }

#stage { height: min(46vh, 34rem); width: min(46vh, 34rem, 72vw); display: flex; align-items: center; justify-content: center;
         touch-action: none; user-select: none; }
#stage.wide { width: min(56rem, 78vw); }
#stage > * { transition: transform 160ms ease-in, opacity 160ms ease-in; }
#stage.dragging > * { transition: none; }
#stage img, #stage video { width: 100%; height: 100%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
#stage.swipe { cursor: grab; }
#stage iframe { width: 100%; height: 100%; border: 1px solid var(--edge); border-radius: var(--radius); background: #fff; }
#stage pre { width: 100%; max-height: 100%; overflow: auto; margin: 0; padding: 1.1rem 1.3rem; border-radius: var(--radius);
             background: var(--ground-2); font-size: 0.8rem; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
#stage .none { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--muted); }

/* A small image as a chat would show it, inline and larger, on a light and a
   dark ground: an emoji is seen on both, and transparency can hide it on one.
   The bars stand in for the words around it. */
#chat { display: flex; gap: 0.75rem; }
#chat[hidden] { display: none; }
.chip { display: flex; align-items: center; gap: 0.45rem; padding: 0.5rem 0.75rem; border-radius: var(--radius); }
.chip.day { background: #ffffff; --bar: #dddcdc; }
.chip.night { background: #1a1d21; --bar: #3a3d42; }
.chip i { display: block; height: 0.45rem; border-radius: 0.25rem; background: var(--bar); }
.chip img { object-fit: contain; }

#about { text-align: center; max-width: min(46rem, 90vw); }
#name { font-weight: 600; font-size: 1.3em; line-height: 1.3; color: var(--strong); overflow-wrap: anywhere; }
#where { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 1.1rem; }

#scale { display: grid; gap: 0.4rem; }
#scale.digits { grid-template-columns: repeat(10, 3.2rem); }
/* The swipe buttons sit as the arrow keys do: left, then right. */
#scale.swipe { grid-template-columns: repeat(2, 9rem); grid-template-areas: "left right"; }
.cell { position: relative; overflow: hidden; height: 3rem; border: 1px solid var(--edge); border-radius: var(--radius);
        background: none; color: var(--body); cursor: pointer; font: inherit;
        display: flex; align-items: center; justify-content: center; transition: border-color 120ms, background 120ms; }
#scale.digits .cell { font: 500 1.05rem var(--font-mono); }
#scale.swipe .cell { font-size: 1rem; }
.cell:hover { border-color: var(--muted); }
.cell.on { border-color: var(--accent); background: var(--wash); color: var(--strong); }
.cell.aim { border-color: var(--muted); background: var(--wash-ink); }
/* How many items carry this rating, drawn as a bar along the cell's foot. */
.cell .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--edge); }
.cell.on .bar { background: var(--accent); }
.cell kbd { position: absolute; top: 0.2rem; right: 0.35rem; font-size: 0.65rem; color: var(--muted); display: none; }
body.keys .cell kbd { display: block; }

#error { color: var(--accent-2); min-height: 1.2em; }

/* An item's comment: shown under its name, written in the box C opens. */
#note { color: var(--muted); font-style: italic; max-width: min(46rem, 90vw); text-align: center; overflow-wrap: anywhere; }
#note:empty { display: none; }
#notebox { width: min(46rem, 90vw); font: inherit; font-size: 0.95rem; color: var(--body); background: var(--ground-2);
           border: 1px solid var(--accent); border-radius: var(--radius); padding: 0.45rem 0.7rem; }
#notebox[hidden] { display: none; }
#comment { border: 0; background: none; color: var(--muted); cursor: pointer; text-decoration: underline dotted; }
#comment:hover { color: var(--body); }

#help { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: color-mix(in srgb, var(--ground) 70%, transparent); }
#help[hidden] { display: none; }
#help table { background: var(--ground-2); border-radius: var(--radius); padding: 1.2rem 1.6rem; border-spacing: 1.4rem 0.35rem; }
#help td:first-child { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); text-align: right; }

@media (max-width: 720px) {
  body { font-size: 17px; }
  header { padding: 0.7rem 1rem 0; }
  main { gap: 1rem; padding-left: 0.75rem; padding-right: 0.75rem; }
  .step { display: none; }
  #stage { height: 44vh; width: min(44vh, 92vw); }
  #stage.wide { width: 92vw; }
  #scale.digits { grid-template-columns: repeat(5, minmax(3rem, 17vw)); }
  #scale.swipe { grid-template-columns: repeat(2, minmax(7rem, 44vw)); }
  .cell { height: 3.25rem; }
}
</style>
</head>
<body>
<div id="progress"><div></div></div>
<header>
  <span class="v-meta" id="folder"></span>
  <span class="v-meta" id="count"></span>
</header>
<main>
  <div id="card">
    <button class="step" id="back" title="Previous ( [ )"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div id="stage"></div>
    <button class="step" id="forward" title="Next ( ] )"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <div id="chat" hidden>
    <span class="chip day"><i style="width:2.2rem"></i><span class="slot" data-px="22"></span><i style="width:1.4rem"></i><span class="slot" data-px="32"></span></span>
    <span class="chip night"><i style="width:2.2rem"></i><span class="slot" data-px="22"></span><i style="width:1.4rem"></i><span class="slot" data-px="32"></span></span>
  </div>
  <div id="about">
    <div id="name"></div>
    <div class="v-meta" id="where"></div>
  </div>
  <div id="note"></div>
  <button class="v-meta" id="comment" title="Comment on this one ( C )">comment</button>
  <input id="notebox" hidden maxlength="2000" placeholder="A comment on this one; Enter keeps it, Escape drops it">
  <div id="scale"></div>
  <div class="v-meta" id="error"></div>
</main>
<div id="help" hidden><table id="keys"></table></div>
<script>
const DATA = /*DATA*/null;
const theme = new URLSearchParams(location.search).get("theme");
if (theme === "day" || theme === "night") document.documentElement.dataset.theme = theme;

const items = DATA.items, ratings = DATA.ratings, notes = DATA.notes, values = DATA.values;
const swipe = DATA.scale === "swipe";
const $ = id => document.getElementById(id);
const keyName = k => ({ ArrowLeft: "←", ArrowRight: "→", ArrowUp: "↑", ArrowDown: "↓" })[k] || k.toUpperCase();
const norm = k => k.length === 1 ? k.toLowerCase() : k;
const byKey = {}, byFly = {};
for (const v of values) { for (const k of v.keys) byKey[norm(k)] = v; if (v.fly) byFly[v.fly] = v; }

$("folder").textContent = DATA.root;
$("scale").className = DATA.scale;
$("stage").classList.toggle("swipe", swipe);

let at = Math.max(0, items.findIndex(it => !(it.sha in ratings)));
let busy = false;

for (const v of values) {
  const b = document.createElement("button");
  b.className = "cell"; b.dataset.v = v.value;
  if (v.fly) b.style.gridArea = v.fly;
  b.append(v.label);
  const kbd = document.createElement("kbd"); kbd.textContent = v.keys.map(keyName).join(" "); b.append(kbd);
  const bar = document.createElement("span"); bar.className = "bar"; b.append(bar);
  b.onclick = () => rate(v.value);
  $("scale").append(b);
}

const KEYS = [
  [swipe ? "← →   A D" : "0 – 9", "Rate"],
  [swipe ? "[   ]" : "←   →   [   ]", "Step back, forward"],
  ["C", "Comment on this one"],
  ["N", "Next unrated"],
  ["Backspace", "Clear the rating"],
  ["Alt", "Keys on the buttons"],
  ["?", "These keys"],
];
for (const [k, what] of KEYS) {
  const tr = $("keys").insertRow();
  tr.insertCell().textContent = k; tr.insertCell().textContent = what;
}

function size(bytes) {
  for (const [unit, n] of [["GB", 1e9], ["MB", 1e6], ["kB", 1e3]]) if (bytes >= n) return `${(bytes / n).toFixed(1)} ${unit}`;
  return `${bytes} B`;
}

function preview(item) {
  const src = `/file/${item.sha}`;
  if (item.kind === "image") return Object.assign(document.createElement("img"), { src, alt: item.name, draggable: false });
  if (item.kind === "video") return Object.assign(document.createElement("video"), { src, autoplay: true, loop: true, muted: true, playsInline: true });
  if (item.kind === "audio") return Object.assign(document.createElement("audio"), { src, autoplay: true, controls: true });
  if (item.kind === "pdf") return Object.assign(document.createElement("iframe"), { src });
  if (item.kind === "text") {
    const pre = document.createElement("pre");
    fetch(`/text/${item.sha}`).then(r => r.text()).then(t => { if (items[at] === item) pre.textContent = t; });
    return pre;
  }
  return Object.assign(document.createElement("div"), { className: "none", textContent: size(item.bytes) });
}

function render() {
  const item = items[at];
  const shown = preview(item);
  $("stage").classList.toggle("wide", ["text", "pdf"].includes(item.kind));
  $("stage").replaceChildren(shown);

  $("chat").hidden = true;
  if (item.kind === "image") {
    shown.addEventListener("load", () => {
      if (items[at] !== item || shown.naturalWidth > 256) return;
      document.querySelectorAll(".slot").forEach(s => s.replaceChildren(
        Object.assign(document.createElement("img"), { src: shown.src, width: +s.dataset.px, height: +s.dataset.px })));
      $("chat").hidden = false;
    }, { once: true });
  }

  $("name").textContent = item.name;
  $("name").title = size(item.bytes);
  const folders = [...new Set(item.paths.filter(p => p.includes("/")).map(p => p.slice(0, p.lastIndexOf("/"))))];
  $("where").replaceChildren(...folders.map(f => Object.assign(document.createElement("span"), { textContent: f })));
  $("note").textContent = notes[item.sha] || "";

  const counts = {};
  for (const r of Object.values(ratings)) counts[r] = (counts[r] || 0) + 1;
  const most = Math.max(1, ...Object.values(counts));
  document.querySelectorAll(".cell").forEach(c => {
    const v = values.find(v => v.value === +c.dataset.v), n = counts[v.value] || 0;
    c.classList.toggle("on", ratings[item.sha] === v.value);
    c.querySelector(".bar").style.width = `${100 * n / most}%`;
    c.title = [v.hint, `${n} rated so far`].filter(Boolean).join(". ");
  });
  const done = Object.keys(ratings).length;
  $("count").textContent = `${done} / ${items.length}`;
  $("progress").firstChild.style.width = `${100 * done / items.length}%`;

  // The next few, fetched now, so a rating moves on without a wait.
  for (const next of items.slice(at + 1, at + 6)) if (next.kind === "image") new Image().src = `/file/${next.sha}`;
}

function nextUnrated(from) {
  for (let i = 1; i <= items.length; i++) {
    const j = (from + i) % items.length;
    if (!(items[j].sha in ratings)) return j;
  }
  return -1;
}

const FLY = { left: "translate(-70vw, 0) rotate(-14deg)", right: "translate(70vw, 0) rotate(14deg)" };
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

function fly(direction) {
  const card = $("stage").firstChild;
  if (!direction || still || !card) return Promise.resolve();
  card.style.transform = FLY[direction];
  card.style.opacity = "0";
  return new Promise(done => setTimeout(done, 160));   // the length of the CSS transition above
}

async function rate(rating) {
  if (busy) return;
  busy = true;
  const item = items[at];
  try {
    const r = await fetch("/rate", { method: "POST", body: JSON.stringify({ sha: item.sha, rating }) });
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    $("error").textContent = "";
    if (rating === null) delete ratings[item.sha];
    else {
      ratings[item.sha] = rating;
      await fly(values.find(v => v.value === rating).fly);
      // On to the next unrated one; once every one is rated, on to the next in order.
      const next = nextUnrated(at);
      at = next >= 0 ? next : (at + 1) % items.length;
    }
    render();
  } catch (e) {
    $("error").textContent = `Not saved: ${e.message}. Is ratings serve still running?`;
    render();
  } finally {
    busy = false;
  }
}

// The comment box: C opens it on the item shown, Enter keeps what it holds
// (empty clears the comment), Escape closes it unchanged.
function openNote() {
  const box = $("notebox");
  box.value = notes[items[at].sha] || "";
  box.hidden = false;
  box.focus();
}
async function keepNote() {
  const box = $("notebox"), item = items[at], note = box.value.trim();
  try {
    const r = await fetch("/note", { method: "POST", body: JSON.stringify({ sha: item.sha, note }) });
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    if (note) notes[item.sha] = note; else delete notes[item.sha];
    $("error").textContent = "";
    box.hidden = true;
    render();
  } catch (e) {
    $("error").textContent = `Comment not saved: ${e.message}. Is ratings serve still running?`;
  }
}
$("comment").onclick = openNote;
$("notebox").addEventListener("keydown", e => {
  e.stopPropagation();   // typing here is the comment, not the page's keys
  if (e.key === "Enter") { e.preventDefault(); keepNote(); }
  else if (e.key === "Escape") { e.preventDefault(); $("notebox").hidden = true; }
});

function step(by) { $("notebox").hidden = true; at = (at + by + items.length) % items.length; render(); }
$("back").onclick = () => step(-1);
$("forward").onclick = () => step(1);

// Dragging the card: on the swipe scale it rates in the direction it is let go,
// once it has travelled far enough; on the digits scale left and right step.
let drag = null;
const FAR = 90;
function direction(dx, dy) {
  if (Math.abs(dx) < FAR || Math.abs(dy) > Math.abs(dx)) return null;   // only a sideways throw rates
  return dx > 0 ? "right" : "left";
}
function aim(dir) {
  document.querySelectorAll(".cell").forEach(c => c.classList.toggle("aim", !!dir && byFly[dir]?.value === +c.dataset.v));
}
$("stage").addEventListener("pointerdown", e => {
  // A mouse inside text, a PDF or a player is selecting or seeking, not dragging.
  if (busy || e.button > 0 || (e.pointerType === "mouse" && ["PRE", "IFRAME", "AUDIO", "VIDEO"].includes(e.target.tagName))) return;
  drag = { x: e.clientX, y: e.clientY, id: e.pointerId };
  $("stage").setPointerCapture(e.pointerId);
  $("stage").classList.add("dragging");
});
$("stage").addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y, card = $("stage").firstChild;
  if (swipe) {
    card.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 18}deg)`;
    aim(direction(dx, dy));
  } else {
    card.style.transform = `translate(${dx * 0.4}px, 0)`;
  }
});
function release(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const dir = direction(e.clientX - drag.x, e.clientY - drag.y);
  drag = null;
  $("stage").classList.remove("dragging");
  aim(null);
  if (swipe && dir) return rate(byFly[dir].value);
  if (!swipe && (dir === "left" || dir === "right")) return step(dir === "left" ? 1 : -1);
  const card = $("stage").firstChild;
  if (card) card.style.transform = "";
}
$("stage").addEventListener("pointerup", release);
$("stage").addEventListener("pointercancel", release);

addEventListener("keydown", e => {
  if (e.key === "Alt") { document.body.classList.add("keys"); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!$("help").hidden && (e.key === "Escape" || e.key === "?")) { $("help").hidden = true; e.preventDefault(); return; }
  const v = byKey[norm(e.key)];
  if (v) rate(v.value);
  else if (e.key === "]" || (!swipe && e.key === "ArrowRight")) step(1);
  else if (e.key === "[" || (!swipe && e.key === "ArrowLeft")) step(-1);
  else if (e.key === "Backspace" || e.key === "Delete") rate(null);
  else if (e.key === "c" || e.key === "C") openNote();
  else if (e.key === "n" || e.key === "N") { const j = nextUnrated(at); if (j >= 0) { at = j; render(); } }
  else if (e.key === "?") $("help").hidden = false;
  else return;
  e.preventDefault();
});
addEventListener("keyup", e => { if (e.key === "Alt") document.body.classList.remove("keys"); });
addEventListener("blur", () => document.body.classList.remove("keys"));
$("help").onclick = () => { $("help").hidden = true; };

render();
</script>
</body>
</html>
