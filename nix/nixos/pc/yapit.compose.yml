# The yapit instance on pc that `yoink-tube` fetches through (zsh/aliases):
# laid over yapit's docker-compose.selfhost.yml, which publishes the web entry
# point, the gateway and Postgres on every address. Docker opens published
# ports in its own iptables chains, ahead of the NixOS firewall, so on pc those
# would be open to the home LAN, Postgres with the password yapit ships.
# Only the web entry point stays published, on pc's tailnet address.
services:
  frontend:
    ports: !override
      - "100.122.146.47:8642:8080"
  gateway:
    ports: !reset []
  postgres:
    ports: !reset []
